---
id: intro
nav: Introduction
title: About this guide
---

This guide sets up Anthropic's Claude Desktop app on Windows so that its Claude Code agent runs sandboxed inside WSL (Linux) rather than directly on Windows. Regular Claude chat in the app is not affected.

It also covers:

- Installing Microsoft VS Code on Windows.
- Cloning Ursa GitHub repositories from GitHub into the WSL filesystem.

When you're done, two accounts share the work:

- **You** edit in VS Code, which connects to WSL over Remote-SSH as your own Linux user. Edits, commits, and GitHub access are yours.
- **The Claude Code agent** runs in WSL as a separate, restricted `claude` user, limited to the repository you share with it and to approved network destinations.

---
id: overview
nav: Overview
title: What this setup protects
---

1. **Dedicated low-privilege user:** the `claude` account can access the repository you explicitly share, but not your normal home directory, SSH keys, or the rest of the machine.
2. **Claude Code sandbox:** `/sandbox` adds filesystem and network isolation around commands the agent runs.

### Why not just use Claude Desktop or Claude Code on the web?

**Claude Desktop on native Windows does not provide this bash sandbox.** The OS-level sandbox used by Claude Code runs on WSL2, Linux, and macOS, not directly in Windows PowerShell. Running Claude Code natively from PowerShell would therefore give it your normal Windows user permissions instead of the two isolation layers configured in this guide.

**Claude Code on the web is a different workflow.** It runs in the cloud and is oriented around GitHub pull requests rather than the live local loop of editing files, running tests, and talking to the agent against your working copy.

For an interactive local workflow on Windows with both a dedicated low-privilege user and Claude Code's built-in sandbox, WSL2 is the required path rather than an optional convenience.

> [!WARNING]
> **Approval first:** before proceeding to Step 1, get the appropriate approvals from IT; otherwise ThreatLocker will block the setup.

> [!NOTE]
> **Prerequisites:** before starting Step 1:
>
> - Install [Claude Desktop](https://claude.ai/download) on Windows. This guide doesn't cover installing it.
> - **IT:** confirm your Claude seat includes Claude Code, and enable WSL sessions in Claude Desktop. Desktop turns WSL sessions off by default on organization-managed devices; IT turns them on by setting the `disableWslSessions` value under `HKLM\SOFTWARE\Policies\Claude` to `false` (Claude Desktop v1.19367.0 or later).
>
> Claude Desktop runs its Claude Code sessions inside WSL as WSL's default user. Step 8 makes that the restricted `claude` user, and Step 11 confirms it.

---
id: step1
nav: 1. Install WSL2
step: 1
title: Install WSL2 from Windows
lead: Open **PowerShell as Administrator**.
---

Install WSL itself, without a Linux distribution:

```powershell title="PowerShell"
wsl --install
```

Reboot if prompted, then list the distributions available to install:

```powershell title="PowerShell"
wsl --list --online
```

Install Ubuntu 26.04:

```powershell title="PowerShell"
wsl --install Ubuntu-26.04
```

Reboot when prompted, then choose a local username and password for Ubuntu.

> [!TIP]
> Ubuntu asks for the username and password in the terminal window when it first starts, not in a separate Windows dialog. Use the same username you entered as **WSL username** under **Customize this guide** so the commands below match. You may consider a shorter name for ease of keyboard entry.

> [!NOTE]
> **Optional — if something fails later:** new distributions install as WSL 2 by default. To confirm, check the VERSION column:
>
> ```powershell title="PowerShell"
> wsl -l -v
> ```
>
> Only if Ubuntu-26.04 shows VERSION 1, convert it:
>
> ```powershell title="PowerShell"
> wsl --set-version Ubuntu-26.04 2
> ```

> [!TIP]
> Everything after this step runs inside the Ubuntu / WSL terminal unless the guide explicitly says otherwise.

---
id: step2
nav: 2. Place the repo
step: 2
title: Keep the repository on the Linux filesystem
lead: Use your WSL home directory rather than `/mnt/c/...`. Cross-boundary file access is commonly 5–10× slower and can degrade Claude Code file search, dependency installs, and builds.
---

### Create a GitHub SSH key

The key lives in your normal account's `~/.ssh`, which the `claude` user created later can't read. A passphrase is optional.

```bash title="WSL — your normal user"
mkdir -p ~/.ssh && chmod 700 ~/.ssh
ssh-keygen -t ed25519 -C "{{GITHUB_USER}}@wsl" -f ~/.ssh/ursa-github
```

> [!NOTE]
> The `-C` value is just a label stored with the key, so you can later tell which key is which. Use any text that helps you recognize it. It plays no part in authentication: GitHub identifies you by the key itself, not by the label, your email, or your GitHub username.

### Use the key for GitHub

SSH only tries keys with default names on its own, so point GitHub connections at `ursa-github` explicitly:

```bash title="WSL — your normal user"
cat >> ~/.ssh/config <<'EOF'

Host github.com
  HostName github.com
  User git
  IdentityFile ~/.ssh/ursa-github
  IdentitiesOnly yes
EOF
chmod 600 ~/.ssh/config
```

### Add the public key to GitHub

Print the public key and copy the whole line:

```bash title="WSL — your normal user"
cat ~/.ssh/ursa-github.pub
```

In GitHub, signed in as `{{GITHUB_USER}}`, go to [Settings → SSH and GPG keys](https://github.com/settings/keys), choose **New SSH key**, and paste it.

Test the connection. Accept the host fingerprint on first connect; GitHub should greet you as `{{GITHUB_USER}}`:

```bash title="WSL — your normal user"
ssh -T git@github.com
```

### Fork and clone the repository

On GitHub, fork `{{REPO}}` into your personal Ursa account, `{{GITHUB_USER}}`. Then clone your fork into `~/git`:

```bash title="WSL — your normal user"
mkdir -p ~/git
cd ~/git
git clone git@github.com:{{GITHUB_USER}}/{{REPO}}.git
```

---
id: step3
nav: 3. Create agent user
step: 3
title: Create the shared group and low-privilege agent user
lead: The shared group lets your normal account and the `claude` account both edit the repository without granting broader access. This is simpler and generally more reliable than per-user POSIX ACLs, which can develop mask-related permission surprises when build tools create files.
---

```bash title="WSL — your normal user"
# Shared group
sudo groupadd agentic

# Dedicated user with its own home. It is intentionally not added to sudo.
sudo useradd -m -s /bin/bash -G agentic claude

# Add your current user to the shared group
sudo usermod -aG agentic "$USER"
```

Restart WSL so the new group membership takes effect. Close all Ubuntu terminals, then run this in PowerShell:

```powershell title="PowerShell"
wsl --shutdown
```

Start WSL again by typing `wsl` in PowerShell. You're signed in as your normal user. Confirm `agentic` appears in your groups:

```bash title="WSL — your normal user"
id -nG | grep -w agentic
```

### Block the `claude` command on your main account

Add an alias to your main account's shell init so you do not accidentally run `claude` outside the low-privilege `claude` user and lose the isolation:

```bash title="WSL — your normal user"
# Main account
cat >> ~/.bashrc << 'EOF'
alias claude='echo "Please run claude as the claude user (e.g. wsl -u claude from cmd)"'
EOF
source ~/.bashrc
```

---
id: step4
nav: 4. Share repo access
step: 4
title: Grant both accounts access to the repository
---

These commands share only `~/git/{{REPO}}` with `claude`, not the rest of `~/git`. They apply recursively to everything already in the repository, and files and folders added to it later are shared automatically. Other repositories in `~/git` aren't shared: `claude` can't change them, though with Ubuntu's default permissions it can still read them.

```bash title="WSL — your normal user"
# Group-own the repository and everything in it
sudo chgrp -R agentic ~/git/{{REPO}}

# Give the group read/write access. Capital X adds execute only where appropriate.
sudo chmod -R g+rwX ~/git/{{REPO}}

# New files and directories in the repository inherit the agentic group.
sudo find ~/git/{{REPO}} -type d -exec chmod g+s {} +
```

### Make new files group-writable by default

```bash title="WSL — your normal user"
# Your account
echo 'umask 002' >> ~/.bashrc

# The claude account
echo 'umask 002' | sudo tee -a /home/claude/.bashrc
```

### Allow path traversal into your home directory

```bash title="WSL — your normal user"
chmod o+x /home/{{USERNAME}}
```

This grants traverse permission only; it does not let the `claude` user list your home directory contents.

### Show the repository in `claude`'s home

Claude Desktop's WSL folder picker browses as `claude` and starts in `claude`'s home. Because `claude` can't list your home directory, it can't click through to the repository from there. A symlink in `claude`'s home doesn't solve this: the picker doesn't show symlinks as folders it can open. Instead, bind-mount the repository into `claude`'s home, so it appears there as a normal folder. Both paths show the same files.

Create an empty folder and mount the repository onto it:

```bash title="WSL — your normal user"
sudo mkdir /home/claude/{{REPO}}
sudo mount --bind /home/{{USERNAME}}/git/{{REPO}} /home/claude/{{REPO}}
```

Make the mount come back after WSL restarts by adding it to `/etc/fstab`:

```bash title="WSL — your normal user"
echo '/home/{{USERNAME}}/git/{{REPO}} /home/claude/{{REPO}} none bind 0 0' | sudo tee -a /etc/fstab
```

WSL applies `/etc/fstab` at startup. That stays on in Step 8: turning off `[automount]` stops only the Windows drive mounts, not `/etc/fstab`.

### Mark the repository as safe for Git

```bash title="WSL — your normal user"
sudo -u claude git config --global --add safe.directory '/home/{{USERNAME}}/git/{{REPO}}'
sudo -u claude git config --global --add safe.directory '/home/claude/{{REPO}}'
```

The second entry covers the bind-mounted path, which Claude Desktop sessions use.

---
id: step5
nav: 5. Install Claude Code
step: 5
title: Install Claude Code as the agent user
lead: The native installer avoids Node.js/npm path issues, installs a self-contained binary, and updates automatically in the background.
---

```bash title="WSL — switch to claude"
sudo -iu claude
```

```bash title="WSL — as claude"
curl -fsSL https://claude.ai/install.sh | bash

echo 'export PATH="$HOME/.local/bin:$PATH"' >> ~/.bashrc
source ~/.bashrc
claude --version
```

### Start in the repository

The repository lives in your normal user's home, at `/home/{{USERNAME}}/git/{{REPO}}`, not in `claude`'s home. Make every new `claude` shell start there:

```bash title="WSL — as claude"
echo 'cd /home/{{USERNAME}}/git/{{REPO}} 2>/dev/null' >> ~/.bashrc
source ~/.bashrc
pwd
```

`pwd` should print `/home/{{USERNAME}}/git/{{REPO}}`. If the folder is missing, the shell stays in `claude`'s home instead of failing.

> [!WARNING]
> **Do not** run the installer or the `claude` command with `sudo`. The agent should run as the non-root `claude` user. Claude Code's bypass-permissions mode is also blocked for root.

---
id: step6
nav: 6. Lock down network
step: 6
title: Restrict the agent user's network access
lead: Route all of the `claude` account's outbound traffic through a Squid proxy that allows only listed domains, and use iptables to reject everything else. These commands require your normal sudo-enabled account. Exit the `claude` shell first.
---

### Install iptables

iptables is not part of WSL by default.

```bash title="WSL — return to your normal user"
exit
```

```bash title="WSL — your normal user"
sudo apt update && sudo apt install -y iptables
```

Confirm owner-match support and that the OUTPUT chain loads:

```bash title="WSL — your normal user"
sudo iptables -m owner --help | head -3
sudo iptables -L OUTPUT -n                 # should print an empty OUTPUT chain, no errors
```

> [!NOTE]
> If the second command fails with an error such as `Failed to initialize nft` or `table does not exist`, the WSL kernel doesn't support the nftables backend Ubuntu uses by default. Switching to the legacy backend (`iptables-legacy` via `update-alternatives`) may work, but it is untested here; research it before proceeding.

### Install and configure Squid

```bash title="WSL — your normal user"
sudo apt install -y squid
```

```bash title="WSL — your normal user"
sudo tee /etc/squid/squid.conf >/dev/null <<'EOF'
http_port 127.0.0.1:3128
acl allowed dstdomain "/etc/squid/allowed-domains.txt"
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access deny CONNECT !SSL_ports
http_access allow localhost allowed
http_access deny all
cache deny all
EOF
```

The allowlist starts with only the domains Claude Code needs. Uncomment others as your workflow requires them:

```bash title="WSL — your normal user"
sudo tee /etc/squid/allowed-domains.txt >/dev/null <<'EOF'
.anthropic.com
.claude.ai
.claude.com
#.github.com
#.githubusercontent.com
#registry.npmjs.org
#pypi.org
#files.pythonhosted.org
EOF
```

> [!WARNING]
> **Optional, evaluation period only: allow all domains.** While this WSL setup is being evaluated, you can open Squid to every domain instead of only the allowlist. This overwrites `/etc/squid/squid.conf`. The iptables rules below still force `claude`'s traffic through Squid, but Squid no longer filters it. Switch the two marked lines back to `deny` before production use.
>
> ```bash title="WSL — your normal user"
> sudo tee /etc/squid/squid.conf >/dev/null <<'EOF'
> http_port 127.0.0.1:3128
> acl allowed dstdomain "/etc/squid/allowed-domains.txt"
> acl SSL_ports port 443
> acl CONNECT method CONNECT
> http_access deny CONNECT !SSL_ports
> http_access allow localhost allowed
> # deny all for prod
> http_access allow all
> # deny all for prod
> cache allow all
> EOF
> ```

Validate the configuration and restart Squid:

```bash title="WSL — your normal user"
sudo squid -k parse && sudo service squid restart
```

### Add iptables rules for the `claude` user

```bash title="WSL — your normal user"
for ipt in iptables ip6tables; do
  sudo $ipt -N CLAUDE_OUT 2>/dev/null || sudo $ipt -F CLAUDE_OUT   # create, or empty if it exists
  sudo $ipt -A CLAUDE_OUT -o lo -j ACCEPT          # loopback: Squid, local dev servers
  sudo $ipt -A CLAUDE_OUT -j REJECT                # everything else, including DNS
  sudo $ipt -C OUTPUT -m owner --uid-owner claude -j CLAUDE_OUT 2>/dev/null \
    || sudo $ipt -A OUTPUT -m owner --uid-owner claude -j CLAUDE_OUT   # add the jump only once
done
```

Blocking DNS is deliberate. Squid resolves names itself, so `claude` never needs DNS, and blocking it closes DNS tunneling as an exfiltration path.

> [!NOTE]
> Allowing all loopback traffic lets `claude` reach any local service, including one that forwards traffic out. You can tighten it to `-p tcp --dport 3128` later.

### Persist the rules

```bash title="WSL — your normal user"
sudo DEBIAN_FRONTEND=noninteractive apt install -y iptables-persistent
```

Then save the current rules:

```bash title="WSL — your normal user"
sudo netfilter-persistent save
```

> [!NOTE]
> The saved rules and Squid start automatically at boot once systemd is enabled in Step 8. After any change to the rules, run `sudo netfilter-persistent save` again.

### Point `claude`'s tools at the proxy

```bash title="WSL — switch to claude"
sudo -iu claude
```

```bash title="WSL — as claude"
tee -a ~/.bashrc >/dev/null <<'EOF'
export HTTP_PROXY=http://127.0.0.1:3128 HTTPS_PROXY=http://127.0.0.1:3128
export http_proxy=$HTTP_PROXY https_proxy=$HTTPS_PROXY
export NO_PROXY=localhost,127.0.0.1 no_proxy=localhost,127.0.0.1
EOF
```

> [!NOTE]
> These variables only make things work; they don't enforce anything. If `claude` removes them, its traffic hits the REJECT rule instead of getting out.

> [!TIP]
> Restart the profile with `source ~/.bashrc`, or open a new `claude` shell, so the variables take effect.

---
id: step7
nav: 7. Enable sandbox
step: 7
title: Enable the sandbox
lead: The dependency installation and system configuration require your normal sudo-enabled account. Exit the `claude` shell first.
---

```bash title="WSL — return to your normal user"
exit
```

```bash title="WSL — your normal user"
sudo apt update
sudo apt install -y bubblewrap socat
```

### Ubuntu 24.04 and later: check AppArmor

```bash title="WSL — your normal user"
sysctl kernel.apparmor_restrict_unprivileged_userns
```

If the command returns `1`, allow unprivileged user namespaces:

```bash title="WSL — your normal user"
echo 'kernel.apparmor_restrict_unprivileged_userns = 0' | \
  sudo tee /etc/sysctl.d/99-claude-sandbox.conf
sudo sysctl --system
```

> [!WARNING]
> This relaxes a system-wide hardening setting. On a dedicated development machine that may be an acceptable tradeoff. A targeted AppArmor profile for Bubblewrap is the more surgical option.

### Enforce the sandbox with managed settings

Create a root-owned managed settings file so Claude Code always runs sandboxed. Because `claude` has no sudo access, it can't change or remove this policy:

```bash title="WSL — your normal user"
sudo mkdir -p /etc/claude-code
sudo tee /etc/claude-code/managed-settings.json >/dev/null <<'EOF'
{
  "env": {
    "HTTPS_PROXY": "http://127.0.0.1:3128",
    "HTTP_PROXY": "http://127.0.0.1:3128",
    "NO_PROXY": "localhost,127.0.0.1"
  },
  "sandbox": {
    "enabled": true,
    "failIfUnavailable": true,
    "autoAllowBashIfSandboxed": true,
    "allowUnsandboxedCommands": false,
    "network": {
      "httpProxyPort": 3128
    }
  }
}
EOF
```

### Start Claude Code in the repository

```bash title="WSL — switch to claude"
sudo -iu claude
```

```bash title="WSL — as claude"
cd /home/{{USERNAME}}/git/{{REPO}}
claude
```

The first run opens an Anthropic sign-in flow. In WSL, the browser commonly opens on Windows and gives you a code to paste back into the terminal. This authentication belongs to the `claude` Linux account and is stored in that user's home directory.

Inside Claude Code, run:

```text title="Claude Code"
/sandbox
```

The sandbox panel reports whether `ripgrep`, `bubblewrap`, `socat`, and the optional seccomp filter are available.

- **Auto-allow:** sandboxed commands run without prompting; operations that need to escape the sandbox fall back to a normal permission prompt.
- **Regular permissions:** the sandbox remains enabled, but each command still prompts.

The sandbox grants read/write access to the working directory and routes network access through an allowlist proxy.

### Return to your normal user

The next step needs your sudo-enabled account. First quit Claude Code:

```text title="Claude Code"
/exit
```

Then leave the `claude` shell:

```bash title="WSL — return to your normal user"
exit
```

---
id: step8
nav: 8. Lock down WSL
step: 8
title: Restrict Windows access and make claude the default user
lead: By default, every Linux user — including the `claude` account — can read your Windows drives under `/mnt/c` and launch Windows programs as your Windows user. These settings close both paths and make WSL open as `claude` instead of your sudo-enabled account.
---

Overwrite `/etc/wsl.conf` with these settings. This replaces anything already in the file:

```bash title="WSL — your normal user"
sudo tee /etc/wsl.conf >/dev/null <<'EOF'
[boot]
systemd=true #can fail when other WSL instances are running

[user]
default=claude 

# Must be the designated, hardened claude user, 
# othewise Win Desktop Claude Code,
# will have the other/normal/standard user's perms

[automount]
enabled = false
options = "metadata,umask=777" 

# Default user is claude. If human user needs to access /mnt/c, then try 707. 
# 707 will disallow default/claude user, 
# while allow others in the group and denies those outside of group. 
# Assumption: claude and human are same group
# Note that the claude group (agentic) must be 1000. 
# In our current config, it winds up being 1001 and that won't work; 
# all users still denied. 


[interop]
appendWindowsPath = false 
enabled = true 

# When disabled, "code" command for vsCode in WSL will NOT launch VS Code in Windows. 
# Claude agent spawn from Win Claude Desktop will also fail.

EOF
```

Restart WSL so the changes take effect. First exit the Ubuntu terminal:

```bash title="WSL — your normal user"
exit
```

Then, in PowerShell, shut WSL down:

```powershell title="PowerShell"
wsl --shutdown
```

Reopen Ubuntu/Linux by typing `wsl` in PowerShell. You'll now be signed in as `claude`.

> [!TIP]
> For admin work later, open your normal account from PowerShell with `wsl -u {{USERNAME}}`.

---
id: step9
nav: 9. Connect VS Code
step: 9
title: Connect VS Code as your normal user
lead: WSL now opens as `claude`, so VS Code's WSL extension would connect as `claude` too, and your edits and commits would be made as the agent. Connecting over SSH instead makes VS Code act as your normal account, so files and commits are yours.
---

> [!NOTE]
> Install [VS Code](https://code.visualstudio.com/) on Windows first if you don't already have it.

> [!WARNING]
> Don't open the repository with VS Code's WSL extension or with `code .` from the Ubuntu terminal; both connect as `claude`. Use Remote - SSH as your normal user, set up below.

### Run an SSH server in WSL

The server listens only on `127.0.0.1:2222`, accepts key logins only, and admits only your normal account. Open WSL as that account:

```powershell title="PowerShell"
wsl -u {{USERNAME}}
```

```bash title="WSL — your normal user"
sudo apt update && sudo apt install -y openssh-server
```

```bash title="WSL — your normal user"
sudo tee /etc/ssh/sshd_config.d/10-wsl.conf >/dev/null <<'EOF'
Port 2222
ListenAddress 127.0.0.1
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AllowUsers {{USERNAME}}
EOF
```

Ubuntu starts SSH on demand through `ssh.socket` by default. Switch to the always-on `ssh` service, then confirm it is listening on `127.0.0.1:2222`:

```bash title="WSL — your normal user"
sudo systemctl disable --now ssh.socket 2>/dev/null
sudo systemctl enable --now ssh
ss -tlnp | grep 2222
```

### Create an SSH key on Windows

The next commands run in PowerShell on Windows, not in WSL. Exit WSL to return to the PowerShell prompt:

```bash title="WSL — your normal user"
exit
```

When asked for a passphrase, press **Enter** twice to leave it empty. The key only opens connections to WSL on this computer (`127.0.0.1:2222`), so a passphrase adds little protection, and without one VS Code connects without prompting.

```powershell title="PowerShell"
New-Item -ItemType Directory -Force "$env:USERPROFILE\.ssh" | Out-Null
ssh-keygen -t ed25519 -C "$env:USERNAME-vscode" -f "$env:USERPROFILE\.ssh\wsl-vscode"
```

### Authorize the key in WSL

Step 8 removed `/mnt/c`, so WSL can no longer read the key from your Windows profile. Pipe it in from PowerShell instead:

```powershell title="PowerShell"
$sh = 'd=/home/{{USERNAME}}/.ssh; ' +
      'mkdir -p $d && chmod 700 $d && ' +
      'tr -d \\r >> $d/authorized_keys && ' +
      'chmod 600 $d/authorized_keys'
Get-Content "$env:USERPROFILE\.ssh\wsl-vscode.pub" |
  wsl -u {{USERNAME}} --exec sh -c $sh
```

### Add an SSH host entry on Windows

```powershell title="PowerShell"
Add-Content "$env:USERPROFILE\.ssh\config" @"

Host wsl
  HostName 127.0.0.1
  Port 2222
  User {{USERNAME}}
  IdentityFile ~/.ssh/wsl-vscode
"@
```

Test the connection. Accept the host fingerprint on first connect; the command should print your normal username:

```powershell title="PowerShell"
ssh wsl whoami
```

### Install Remote - SSH and connect

```powershell title="PowerShell"
code --install-extension ms-vscode-remote.remote-ssh
```

In VS Code, open the Command Palette, run **Remote-SSH: Connect to Host…**, and choose `wsl`. Then use **File → Open Folder** to open `/home/{{USERNAME}}/git/{{REPO}}`.

> [!TIP]
> In later VS Code sessions, start WSL before you connect: type `wsl` in PowerShell and leave that window open. WSL shuts down shortly after its last terminal closes, and that also stops the SSH server, so Remote - SSH can't connect until WSL is running again.

---
id: new-forge
nav: 10. New-Forge setup
step: 10
title: New-Forge setup
lead: Run these in WSL as your normal user, from the VS Code Remote-SSH terminal or `wsl -u {{USERNAME}}`.
---

> [!WARNING]
> **Prerequisite:** ask IT to create a new AWS IAM user specifically for New-Forge work involving the Claude Code agent, with access restricted to what that work needs. Don't use your personal or any existing AWS credentials. IT provides the access key ID and secret access key used in **Add AWS credentials** below.
>
> **For IT:** add the new user to the current New-Forge IAM group, [`ursa-forge-group`](https://us-east-1.console.aws.amazon.com/iam/home?region=us-east-1#/groups/details/ursa-forge-group).

### Install Node.js with nvm

Install Node.js with nvm (Node Version Manager) as your normal user, not with `sudo apt install nodejs npm`. nvm installs Node.js in your home directory, so installing npm packages never needs `sudo`, and you can switch Node.js versions easily. npm comes with Node.js, so there is no separate npm install.

```bash title="WSL — your normal user"
curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.8/install.sh | bash
```

Reload your shell so the `nvm` command is available, then install the current long-term-support release:

```bash title="WSL — your normal user"
source ~/.bashrc
nvm install --lts
```

Confirm both are installed:

```bash title="WSL — your normal user"
node -v
npm -v
```

> [!TIP]
> If New-Forge has an `.nvmrc` file, run `nvm install` inside `~/git/{{REPO}}` instead to get the exact version the project expects.

### Install the project dependencies

Run `npm install` so the project and its scripts are usable:

```bash title="WSL — your normal user"
cd ~/git/{{REPO}}
npm install
```

### Install Python, pip and venv

Ubuntu includes Python 3, but not pip or the `venv` module. Install both:

```bash title="WSL — your normal user"
sudo apt update && sudo apt install -y python3-pip python3-venv
```

Ubuntu blocks `pip install` into the system Python, so install Python packages into a virtual environment instead. Create one in the repository and activate it:

```bash title="WSL — your normal user"
cd ~/git/{{REPO}}
python3 -m venv .venv
source .venv/bin/activate
```

Your prompt now starts with `(.venv)`. Upgrade pip inside the environment and confirm the versions:

```bash title="WSL — your normal user"
python -m pip install --upgrade pip
python --version
pip --version
```

Install SQLMesh into the environment. The version is pinned because New-Forge's `config.py` patches a SQLMesh internal:

```bash title="WSL — your normal user"
pip install sqlmesh==0.235.4
```

Put the environment's `bin` folder at the front of both accounts' `PATH`, so `sqlmesh` and `python3` resolve to the environment without activating it. This matters most for the Claude Code agent, whose shell starts from `claude`'s `~/.bashrc`:

```bash title="WSL — your normal user"
# Your account
echo 'export PATH="/home/{{USERNAME}}/git/{{REPO}}/.venv/bin:$PATH"' >> ~/.bashrc

# The claude account
echo 'export PATH="/home/{{USERNAME}}/git/{{REPO}}/.venv/bin:$PATH"' | sudo tee -a /home/claude/.bashrc
```

Confirm that both accounts find SQLMesh in the environment. Both commands should print `/home/{{USERNAME}}/git/{{REPO}}/.venv/bin/sqlmesh`:

```bash title="WSL — your normal user"
bash -ic 'which sqlmesh'
sudo -iu claude bash -ic 'which sqlmesh'
```

> [!TIP]
> Keep `.venv` out of Git by listing it in `.gitignore` if it isn't already.

> [!TIP]
> **Optional, for editing Python in VS Code:** in the VS Code window connected to `wsl` through Remote - SSH, install the **Python** extension (by Microsoft) with **Install in SSH: wsl**. Then run **Python: Select Interpreter** from the Command Palette and choose `./.venv/bin/python`, so the editor resolves imports from the environment. Running New-Forge scripts doesn't need this.

> [!NOTE]
> **Where the environment is active:**
>
> - **VS Code terminals:** with the Python extension installed, VS Code finds `.venv` when you open the folder and runs `source .venv/bin/activate` in each new integrated terminal for you. The `python.terminal.activateEnvironment` setting controls this and is on by default. To use a different environment, run **Python: Select Interpreter**.
> - **The Claude Code agent:** the `PATH` entry in `claude`'s `~/.bashrc`.
> - **Your own WSL or SSH terminals outside VS Code:** VS Code's activation doesn't reach them. If New-Forge commands don't find the environment there, run `source .venv/bin/activate` from `~/git/{{REPO}}` first.

> [!WARNING]
> **removeMe TODO:** confirm the venv works in a plain WSL terminal as your normal user, outside VS Code, for example `wsl -u {{USERNAME}}` or `ssh wsl`. Run `which python3 sqlmesh`; both should print paths in `~/git/{{REPO}}/.venv/bin` through the `PATH` entry in your `~/.bashrc`. VS Code terminals are confirmed working. If the plain terminal fails, decide whether to fix the `PATH` entry or drop it and document `source .venv/bin/activate` instead.

> [!WARNING]
> **Temporary test note (remove before publishing):** the `PATH` entry is appended to `~/.bashrc`, and Ubuntu's `~/.bashrc` stops early in non-interactive shells. It's unverified whether VS Code tasks run from **Terminal → Run Task…**, such as **Open DuckDB UI**, and the Claude Code agent's shell get past that early stop. If a task or the agent fails with `sqlmesh: command not found` or `No module named 'duckdb'`, the entry didn't apply there; the fallback is to put the `export PATH` line at the top of `~/.bashrc`, before the line that stops non-interactive shells. Also unverified: whether SQLMesh 0.235.4 installs and runs on Ubuntu 26.04's Python (CI uses 3.12), and whether SQLMesh brings in `duckdb` on its own.

### Add AWS credentials

Create a private AWS config folder in your home directory, outside the repository:

```bash title="WSL — your normal user"
mkdir -p ~/.aws
chmod 700 ~/.aws
```

Open the credentials file:

```bash title="WSL — your normal user"
nano ~/.aws/credentials
```

Paste this profile, replacing the placeholder values with the access key ID and secret access key IT provided for the New-Forge IAM user:

```ini title="~/.aws/credentials"
[stock-data]
aws_access_key_id = AKIAxxxxxxxxxxxxxxxx
aws_secret_access_key = your-secret-access-key
```

Save and exit, then make the file readable only by you:

```bash title="WSL — your normal user"
chmod 600 ~/.aws/credentials
```

### Point the `fetch-stock-data` task at the new profile

The project doesn't use the `stock-data` profile automatically yet. In VS Code, open `.vscode/tasks.json` in New-Forge, find the task labelled `fetch-stock-data`, and add this property to it. Add a comma after the property before it, and if the task already has an `options` block, add the `env` entry inside it instead:

```json title=".vscode/tasks.json"
"options": {
  "env": {
    "AWS_PROFILE": "stock-data"
  }
}
```

id: step11
nav: 11. Verify Claude Desktop
step: 11
title: Verify Claude Desktop runs as claude
lead: Confirm that Claude Desktop's Claude Code sessions run inside WSL as the restricted `claude` user, with the managed settings applied.
---

### Start a WSL session

1. In Claude Desktop, open the **Code** tab and start a new session.
2. In the environment selector under the prompt box, choose your Ubuntu distribution under **WSL**.
3. Choose the session's folder. Claude Desktop opens a Windows folder dialog that browses inside WSL as `claude`, starting in `claude`'s home, `/home/claude`. Open the `{{REPO}}` folder there, which is the bind mount from Step 4, and select it. Don't browse to `/home/{{USERNAME}}`; `claude` can't list your home, so the repository can't be reached that way.
4. Trust the folder when asked.

The first session in a distribution takes a little longer while Claude sets up inside it.

> [!NOTE]
> If **WSL** is grayed out with **Disabled by your organization**, IT hasn't enabled WSL sessions yet; see the prerequisites in the Overview.

> [!NOTE]
> **If the session can't write to the repository:** opening the bind-mounted folder from Step 4 should be enough, and in testing Claude Desktop sessions could write without extra settings. If writes are blocked anyway, list the repository in `sandbox.filesystem.allowWrite` in `claude`'s user settings. Run this as your normal user, then start a new session. It overwrites `/home/claude/.claude/settings.json`, including any theme or other settings saved there:
>
> ```bash title="WSL — your normal user"
> sudo -u claude mkdir -p /home/claude/.claude
> sudo -u claude tee /home/claude/.claude/settings.json >/dev/null <<'EOF'
> {
>   "sandbox": {
>     "filesystem": {
>       "allowWrite": ["/home/{{USERNAME}}/git/{{REPO}}"]
>     }
>   }
> }
> EOF
> ```

### Check the user

Send this prompt. The answer should be `claude`:

```text title="Claude Desktop — Code tab"
Run whoami and show me the output.
```

### Check the managed settings

Run this in the session. The `Setting sources` line should list `Enterprise managed settings (file)`:

```text title="Claude Desktop — Code tab"
/status
```

### Check the isolation

Send this prompt. The command should fail with `Permission denied`, because `claude` can't read your AWS credentials:

```text title="Claude Desktop — Code tab"
Run ls /home/{{USERNAME}}/.aws and show me the output.
```

> [!WARNING]
> Don't use the session's **Open in editor** button. It opens VS Code through the WSL extension, which connects as `claude`. Edit in VS Code through Remote - SSH instead (Step 9).

nav: Day-to-day use
title: Day-to-day terminal use
---

- [x] Edit files in VS Code or another editor as your normal user.
- [x] Run Claude Code as the `claude` user, confined to the repository.

id: gotchas
nav: Notes & gotchas
title: Notes and gotchas
---

- **Keep secrets outside the repository.** The agent has full access to its working tree, and Git hooks may execute during Git operations.
- **Do not run Claude Code from native PowerShell.** The Linux sandbox described here does not apply there.
- **Build-tool permissions should remain stable.** Setgid plus `umask 002` keeps files created by tools such as `npm install` and Next.js builds group-writable. Because this setup uses group inheritance rather than ACLs, there is no ACL mask to collapse and usually nothing to repair afterward.
- **Enterprise enforcement is possible.** Organization administrators can centrally require the sandbox rather than leaving it as a per-developer choice, using managed settings such as `enabled` and `failIfUnavailable`.
- **Windows Git Credential Manager won't work from WSL.** With interop disabled, a Git `credential.helper` that points at the Windows `git-credential-manager.exe` can't run. Use SSH keys or a Linux-side credential helper instead.
- **Usage limits are shared.** CLI, desktop, and web sessions draw from the same account usage allowance.

    s = s.replace(/\*\*(?=\S)([\s\S]*?\S)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^\w])__(?=\S)([\s\S]*?\S)__(?!\w)/g, '$1<strong>$2</strong>');
    s = s.replace(/\*(?=\S)([^*]*?\S)\*/g, '<em>$1</em>');
    // _italic_ only at word edges, so names like {{USERNAME_UPPER}}_CODE are left alone.
    s = s.replace(/(^|[^\w])_(?=\S)([^_]*?\S)_(?!\w)/g, '$1<em>$2</em>');
    // Hard line breaks: two trailing spaces or a trailing backslash.
    s = s.replace(/( {2,}|\\)\n/g, '<br>\n');
    return s.replace(/\u0000(\d+)\u0000/g, function (_, i) { return codes[Number(i)]; });
  }

  var FENCE_RE = /^ {0,3}(`{3,}|~{3,})(.*)$/;
  var HEADING_RE = /^ {0,3}(#{1,6})\s+(.*?)(\s+#+)?\s*$/;
  var HR_RE = /^ {0,3}([-*_])(\s*\1){2,}\s*$/;
  var QUOTE_RE = /^ {0,3}>/;
  var LIST_RE = /^( {0,3})([-*+]|\d{1,9}[.)])( +|$)/;
  var TABLE_RE = /^ {0,3}\|/;
  var TABLE_SEP_RE = /^ {0,3}\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/;

  function startsBlock(line) {
    return FENCE_RE.test(line) || HEADING_RE.test(line) || HR_RE.test(line) || QUOTE_RE.test(line) || LIST_RE.test(line) || TABLE_RE.test(line);
  }

  /** GitHub-style pipe table: header row, separator row, body rows. */
  function renderTable(lines) {
    function cells(row) {
      return row.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(function (c) { return renderInline(c.trim()); });
    }
    var head = cells(lines[0]);
    var body = lines.slice(2).map(cells);
    return '<div class="table-wrap"><table><thead><tr>' +
      head.map(function (c) { return '<th>' + c + '</th>'; }).join('') + '</tr></thead><tbody>' +
      body.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>'; }).join('') +
      '</tbody></table></div>';
  }

  function leadingSpaces(line) {
    return line.match(/^ */)[0].length;
  }

  function renderFence(info, code) {
    var lang = (info.split(/\s+/)[0] || 'text').toLowerCase();
    var title = (info.match(/title="([^"]*)"/) || [])[1] || lang;
    return (
      '<div class="code-wrap"><span class="code-label">' + escapeHtml(title) + '</span>' +
      '<button type="button" class="copy">Copy</button>' +
      '<pre><code data-lang="' + escapeHtml(lang) + '">' + escapeHtml(code) + '</code></pre></div>'
    );
  }

  function renderQuote(lines) {
    var m = lines[0].match(/^\s*\[!(\w+)\]\s*(.*)$/);
    var cls = m && CALLOUTS[m[1].toUpperCase()];
    if (cls) {
      var rest = (m[2] ? [m[2]] : []).concat(lines.slice(1));
      return '<div class="' + cls + '">' + renderBlocks(rest.join('\n')) + '</div>';
    }
    return '<blockquote>' + renderBlocks(lines.join('\n')) + '</blockquote>';
  }

  /** Reads one list starting at lines[i]; returns [html, nextIndex]. */
  function renderList(lines, i) {
    var first = lines[i].match(LIST_RE);
    var ordered = /\d/.test(first[2]);
    var items = [];
    var loose = false;

    while (i < lines.length) {
      var m = lines[i].match(LIST_RE);
      if (!m || /\d/.test(m[2]) !== ordered) break;
      var indent = m[1].length + m[2].length + Math.max(1, Math.min(m[3].length, 4));
      var item = [lines[i].slice(indent)];
      i++;
      while (i < lines.length) {
        var line = lines[i];
        if (!line.trim()) {
          // A blank line continues the item only if indented content follows.
          var j = i;
          while (j < lines.length && !lines[j].trim()) j++;
          if (j < lines.length && leadingSpaces(lines[j]) >= indent) {
            for (; i < j; i++) item.push('');
            continue;
          }
          break;
        }
        if (leadingSpaces(line) >= indent) { item.push(line.slice(indent)); i++; continue; }
        if (startsBlock(line)) break;
        item.push(line.trim()); // lazy paragraph continuation
        i++;
      }
      items.push(item);

      // Blank lines between items make it a "loose" list (items wrapped in <p>).
      var k = i;
      while (k < lines.length && !lines[k].trim()) k++;
      if (k > i && k < lines.length) {
        var next = lines[k].match(LIST_RE);
        if (next && /\d/.test(next[2]) === ordered) { loose = true; i = k; continue; }
      }
      if (k > i) break;
    }

    var checklist = !ordered && items.every(function (it) { return /^\[[ xX]\]\s+/.test(it[0]); });
    var tag = ordered ? 'ol' : 'ul';
    var start = ordered && parseInt(first[2], 10) !== 1 ? ' start="' + parseInt(first[2], 10) + '"' : '';
    var html = '<' + tag + start + (checklist ? ' class="checklist"' : '') + '>' +
      items.map(function (it) {
        if (checklist) it[0] = it[0].replace(/^\[[ xX]\]\s+/, '');
        return '<li>' + renderBlocks(it.join('\n'), !loose) + '</li>';
      }).join('') +
      '</' + tag + '>';
    return [html, i];
  }

  /** Block-level Markdown. tight=true leaves paragraphs unwrapped (for tight list items). */
  function renderBlocks(src, tight) {
    var lines = src.replace(/\r\n?/g, '\n').replace(/\t/g, '    ').split('\n');
    var out = [];
    var i = 0;
    var m;

    while (i < lines.length) {
      var line = lines[i];

      if (!line.trim()) { i++; continue; }

      if ((m = line.match(FENCE_RE))) {
        var close = new RegExp('^ {0,3}' + (m[1][0] === '`' ? '`' : '~') + '{' + m[1].length + ',}\\s*$');
        var body = [];
        i++;
        while (i < lines.length && !close.test(lines[i])) body.push(lines[i++]);
        i++; // skip the closing fence
        out.push(renderFence(m[2].trim(), body.join('\n')));
        continue;
      }

      if ((m = line.match(HEADING_RE))) {
        var n = m[1].length;
        out.push('<h' + n + '>' + renderInline(m[2]) + '</h' + n + '>');
        i++;
        continue;
      }

      if (HR_RE.test(line)) { out.push('<hr>'); i++; continue; }

      if (QUOTE_RE.test(line)) {
        var quote = [];
        while (i < lines.length && QUOTE_RE.test(lines[i])) quote.push(lines[i++].replace(/^ {0,3}> ?/, ''));
        out.push(renderQuote(quote));
        continue;
      }

      if (TABLE_RE.test(line) && i + 1 < lines.length && TABLE_SEP_RE.test(lines[i + 1])) {
        var rows = [];
        while (i < lines.length && TABLE_RE.test(lines[i])) rows.push(lines[i++]);
        out.push(renderTable(rows));
        continue;
      }

      if (LIST_RE.test(line)) {
        var list = renderList(lines, i);
        out.push(list[0]);
        i = list[1];
        continue;
      }

      var para = [];
      while (i < lines.length && lines[i].trim() && !startsBlock(lines[i])) para.push(lines[i++].replace(/^\s+/, ''));
      var inline = renderInline(para.join('\n').replace(/\s+$/, ''));
      out.push(tight ? inline : '<p>' + inline + '</p>');
    }
    return out.join('\n');
  }

  /** Tiny frontmatter parser (flat key: value only). */
  /**
   * Splits one Markdown block into sections. A section starts at a "---" line
   * followed by "key: value" lines (including id:) and a closing "---".
   * Lines inside ``` code fences are never treated as frontmatter.
   */
  function splitSections(raw, n) {
    var lines = raw.replace(/\r\n?/g, '\n').split('\n');
    var starts = [];
    var fence = null;
    for (var i = 0; i < lines.length; i++) {
      var f = lines[i].match(/^ {0,3}(`{3,}|~{3,})/);
      if (f) {
        if (!fence) fence = f[1];
        else if (f[1][0] === fence[0] && f[1].length >= fence.length && /^\s*[`~]+\s*$/.test(lines[i])) fence = null;
        continue;
      }
      if (fence || lines[i].trim() !== '---') continue;
      var j = i + 1;
      var hasId = false;
      while (j < lines.length && /^[A-Za-z]+:/.test(lines[j])) { if (/^id:/.test(lines[j])) hasId = true; j++; }
      if (hasId && j < lines.length && lines[j].trim() === '---') { starts.push(i); i = j; }
    }
    if (!starts.length) throw new Error('Markdown block ' + n + ': no frontmatter found (each section starts with --- / id: ... / ---)');
    if (lines.slice(0, starts[0]).join('').trim()) throw new Error('Markdown block ' + n + ': text before the first frontmatter');
    return starts.map(function (start, k) {
      return lines.slice(start, k + 1 < starts.length ? starts[k + 1] : lines.length).join('\n');
    });
  }

  function parseSection(raw, where) {
    var m = raw.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
    if (!m) throw new Error(where + ': missing frontmatter block');
    var meta = {};
    m[1].split(/\r?\n/).forEach(function (line) {
      if (!line.trim()) return;
      var kv = line.match(/^([A-Za-z]+):\s*(.*)$/);
      if (!kv) throw new Error(where + ': bad frontmatter line "' + line + '"');
      meta[kv[1]] = kv[2].replace(/^"(.*)"$/, '$1');
    });
    ['id', 'nav', 'title'].forEach(function (key) {
      if (!meta[key]) throw new Error(where + ': frontmatter needs "' + key + '"');
    });
    if (!/^[a-z0-9-]+$/.test(meta.id)) throw new Error(where + ': id must be lowercase letters, digits, dashes');
    return {
      id: meta.id,
      nav: meta.nav,
      title: meta.title,
      step: meta.step,
      eyebrow: meta.eyebrow,
      leadHtml: meta.lead ? renderInline(meta.lead) : '',
      html: renderBlocks(m[2]),
    };
  }

  /* =================================================================
     Page
     ================================================================= */

  /** Only these characters reach the page, so substituted values can never inject markup. */
  function safeValue(value, fallback) {
    return String(value || '').trim().replace(/[^A-Za-z0-9._-]/g, '') || fallback;
  }

  function applyTemplate(html, username, repo, githubUser) {
    return html
      .split('{{USERNAME_UPPER}}').join(username.toUpperCase())
      .split('{{USERNAME_LOWER}}').join(username.toLowerCase())
      .split('{{USERNAME}}').join(username)
      .split('{{REPO}}').join(repo)
      .split('{{GITHUB_USER}}').join(githubUser);
  }

  function loadSettings() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch (e) { return {}; }
  }

  function saveSettings(settings) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(settings)); } catch (e) { /* storage blocked */ }
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return legacyCopy(text); });
    }
    return Promise.resolve(legacyCopy(text));
  }

  // Clipboard API needs https or localhost; this fallback also works from file://.
  function legacyCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  function sectionHtml(s, u, r, g) {
    var titleId = s.id + '-title';
    var title = '<h2 id="' + titleId + '">' + escapeHtml(s.title) + '</h2>';
    var lead = s.leadHtml ? '<p>' + applyTemplate(s.leadHtml, u, r, g) + '</p>' : '';
    var head = s.step
      ? '<div class="step-header"><div class="step-number" aria-hidden="true">' + escapeHtml(s.step) + '</div>' +
        '<div>' + title + lead + '</div></div>'
      : title + lead;
    return (
      '<section class="card' + (s.eyebrow ? ' appendix' : '') + '" id="' + s.id + '" data-section="' + s.id + '" aria-labelledby="' + titleId + '">' +
      (s.eyebrow ? '<div class="eyebrow appendix-eyebrow">' + escapeHtml(s.eyebrow) + '</div>' : '') +
      head +
      '<div class="card-body">' + applyTemplate(s.html, u, r, g) + '</div>' +
      '</section>'
    );
  }

  var app = document.getElementById('wsl-guide');
  app.innerHTML =
    '<div class="shell">' +
      '<header class="hero">' +
        '<div class="eyebrow">' + escapeHtml(CONFIG.eyebrow) + '</div>' +
        '<h1>' + escapeHtml(CONFIG.title) + '</h1>' +
        '<p>' + escapeHtml(CONFIG.description) + '</p>' +
      '</header>' +
      '<section class="config" aria-labelledby="wsl-guide-config-title">' +
        '<h2 id="wsl-guide-config-title">Customize this guide</h2>' +
        '<p class="config-note">Change these values once. Every affected path and command below updates automatically.</p>' +
        '<div class="fields">' +
          '<label>WSL username<input data-field="username" spellcheck="false" autocomplete="off"></label>' +
          '<label>Repository name<input data-field="repo" spellcheck="false" autocomplete="off"></label>' +
          '<label>GitHub username<input data-field="github" spellcheck="false" autocomplete="off"></label>' +
        '</div>' +
        '<div class="path-preview">Resolved repository path: <strong data-path-preview></strong></div>' +
      '</section>' +
      '<div class="layout">' +
        '<nav aria-label="Guide navigation"><strong>Contents</strong><div data-nav></div></nav>' +
        '<div class="guide-main" data-main></div>' +
      '</div>' +
    '</div>';

  // Look things up inside the guide only, so nothing collides with the host page.
  var userInput = app.querySelector('[data-field="username"]');
  var repoInput = app.querySelector('[data-field="repo"]');
  var githubInput = app.querySelector('[data-field="github"]');
  var pathPreview = app.querySelector('[data-path-preview]');
  var navEl = app.querySelector('[data-nav]');
  var mainEl = app.querySelector('[data-main]');

  var sections = [];
  try {
    Array.prototype.forEach.call(document.querySelectorAll('script[type="text/markdown"]'), function (el, i) {
      splitSections(el.textContent, i + 1).forEach(function (text, k) {
        var s = parseSection(text, 'Markdown block ' + (i + 1) + ', section ' + (k + 1));
        if (sections.some(function (o) { return o.id === s.id; })) throw new Error('duplicate section id "' + s.id + '"');
        sections.push(s);
      });
    });
  } catch (err) {
    mainEl.innerHTML = '<div class="status">Could not render the guide: ' + escapeHtml(err.message) + '</div>';
    throw err;
  }

  var stored = loadSettings();
  userInput.value = stored.username || CONFIG.defaultUsername;
  repoInput.value = stored.repo || CONFIG.defaultRepo;
  githubInput.value = stored.githubUser || CONFIG.defaultGithubUser;

  navEl.innerHTML = sections.map(function (s) {
    return '<a href="#' + s.id + '" data-target="' + s.id + '">' + escapeHtml(s.nav) + '</a>';
  }).join('');

  function setActive(id) {
    Array.prototype.forEach.call(navEl.querySelectorAll('a'), function (a) {
      a.classList.toggle('active', a.getAttribute('data-target') === id);
    });
  }

  // Highlight the TOC entry for the section currently in view.
  var observer = null;
  function observeSections() {
    if (observer) observer.disconnect();
    if (typeof IntersectionObserver === 'undefined') return;
    var els = Array.prototype.slice.call(mainEl.querySelectorAll('[data-section]'));
    var visible = {};
    observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { visible[e.target.getAttribute('data-section')] = e.isIntersecting; });
      var first = els.filter(function (el) { return visible[el.getAttribute('data-section')]; })[0];
      if (first) setActive(first.getAttribute('data-section'));
    }, { rootMargin: '-10% 0px -65% 0px' });
    els.forEach(function (el) { observer.observe(el); });
  }

  function render() {
    var u = safeValue(userInput.value, CONFIG.defaultUsername);
    var r = safeValue(repoInput.value, CONFIG.defaultRepo);
    var g = safeValue(githubInput.value, CONFIG.defaultGithubUser);
    pathPreview.textContent = '/home/' + u + '/git/' + r;
    mainEl.innerHTML = sections.map(function (s) { return sectionHtml(s, u, r, g); }).join('');
    saveSettings({ username: userInput.value, repo: repoInput.value, githubUser: githubInput.value });
    observeSections();
  }

  userInput.addEventListener('input', render);
  repoInput.addEventListener('input', render);
  githubInput.addEventListener('input', render);

  navEl.addEventListener('click', function (e) {
    var a = e.target.closest('a[data-target]');
    if (!a) return;
    // Scroll in place only: no URL or history changes, which fail when the page
    // is hosted without a normal site origin (e.g. inside SharePoint).
    e.preventDefault();
    var id = a.getAttribute('data-target');
    var target = mainEl.querySelector('[data-section="' + id + '"]');
    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    setActive(id);
  });

  // One handler for every Copy button.
  mainEl.addEventListener('click', function (e) {
    var button = e.target.closest('button.copy');
    if (!button) return;
    copyText(button.parentElement.querySelector('code').textContent).then(function (ok) {
      button.textContent = ok ? 'Copied' : 'Copy failed';
      setTimeout(function () { button.textContent = 'Copy'; }, 1200);
    });
  });

  render();
  if (sections.length) setActive(sections[0].id);
})();
</script>
</body>
</html>
