<script type="text/markdown">
---
id: overview
nav: Overview
title: What this setup protects
---

1. **Dedicated low-privilege user:** the `claude` account can access the repository you explicitly share, but not your normal home directory, SSH keys, or the rest of the machine.
2. **Claude Code sandbox:** `/sandbox` adds filesystem and network isolation around commands the agent runs.

### Why not just use Claude Desktop or Claude Code on the web?

**Claude Desktop on native Windows does not provide this bash sandbox.** The OS-level sandbox used by Claude Code runs on WSL2, Linux, and macOS, not directly in Windows PowerShell. Running Claude Code natively from PowerShell would therefore give it your normal Windows user permissions instead of the two isolation layers configured in this guide.

**Claude Code on the web is a different workflow.** It runs in the cloud and is oriented around GitHub pull requests rather than the live local loop of editing files, running tests, and talking to the agent against your working copy.

For an interactive local workflow on Windows with both a dedicated low-privilege user and Claude Code's built-in sandbox, WSL2 is the required path rather than an optional convenience.

> [!WARNING]
> **Approval first:** before proceeding to Step 1, get the appropriate approvals from IT; otherwise ThreatLocker will block the setup.

---
id: step1
nav: 1. Install WSL2
step: 1
title: Install WSL2 from Windows
lead: Open **PowerShell as Administrator**.
---

```powershell title="PowerShell"
wsl --install
```

Reboot when prompted, then choose a local username and password for Ubuntu.

Confirm the distribution is using WSL 2:

```powershell title="PowerShell"
wsl -l -v

# Only if Ubuntu shows VERSION 1:
wsl --set-version Ubuntu 2
```

> [!TIP]
> Everything after this step runs inside the Ubuntu / WSL terminal unless the guide explicitly says otherwise.

---
id: step2
nav: 2. Place the repo
step: 2
title: Keep the repository on the Linux filesystem
lead: Use your WSL home directory rather than `/mnt/c/...`. Cross-boundary file access is commonly 5–10× slower and can degrade Claude Code file search, dependency installs, and builds.
---

```bash title="WSL — your normal user"
mkdir -p ~/git

# Clone the repository here, or move an existing clone here:
cd ~/git
git clone <YOUR_REPOSITORY_URL> {{REPO}}
```

---
id: step3
nav: 3. Create agent user
step: 3
title: Create the shared group and low-privilege agent user
lead: The shared group lets your normal account and the `claude` account both edit the repository without granting broader access. This is simpler and generally more reliable than per-user POSIX ACLs, which can develop mask-related permission surprises when build tools create files.
---

```bash title="WSL — your normal user"
# Shared group
sudo groupadd agentic

# Dedicated user with its own home. It is intentionally not added to sudo.
sudo useradd -m -s /bin/bash -G agentic claude

# Add your current user to the shared group
sudo usermod -aG agentic "$USER"
```

Log out and back in so the new group membership takes effect. For the current shell only, you can instead run:

```bash title="WSL"
newgrp agentic
```

### Block the `claude` command on your main account

Add an alias to your main account's shell init so you do not accidentally run `claude` outside the low-privilege `claude` user and lose the isolation:

```bash title="WSL — your normal user"
# Main account
cat >> ~/.bashrc << 'EOF'
alias claude='echo "Please run claude as the claude user (e.g. wsl -u claude from cmd)"'
EOF
source ~/.bashrc
```

---
id: step4
nav: 4. Share repo access
step: 4
title: Grant both accounts access to the repository
---

```bash title="WSL — your normal user"
cd ~/git

# Group-own the repository tree
sudo chgrp -R agentic {{REPO}}

# Give the group read/write access. Capital X adds execute only where appropriate.
sudo chmod -R g+rwX {{REPO}}

# New files and directories inherit the agentic group.
sudo find {{REPO}} -type d -exec chmod g+s {} +
```

### Make new files group-writable by default

```bash title="WSL — your normal user"
# Your account
echo 'umask 002' >> ~/.bashrc

# The claude account
echo 'umask 002' | sudo tee -a /home/claude/.bashrc
```

### Allow path traversal into your home directory

```bash title="WSL — your normal user"
chmod o+x /home/{{USERNAME}}
```

This grants traverse permission only; it does not let the `claude` user list your home directory contents.

> [!NOTE]
> **Cleaner alternative:** put the shared repository at `/srv/{{REPO}}`, group-own it with `agentic`, and skip the home-directory traversal command.

### Mark the repository as safe for Git

```bash title="WSL — your normal user"
sudo -u claude git config --global --add safe.directory /home/{{USERNAME}}/git/{{REPO}}
```

---
id: step5
nav: 5. Install Claude Code
step: 5
title: Install Claude Code as the agent user
lead: The native installer avoids Node.js/npm path issues, installs a self-contained binary, and updates automatically in the background.
---

```bash title="WSL — switch to claude"
sudo -iu claude

curl -fsSL https://claude.ai/install.sh | bash

echo 'export PATH="$HOME/.local/bin:$PATH"' >> ~/.bashrc
source ~/.bashrc
claude --version
```

> [!WARNING]
> **Do not** run the installer or the `claude` command with `sudo`. The agent should run as the non-root `claude` user. Claude Code's bypass-permissions mode is also blocked for root.

---
id: step6
nav: 6. Enable sandbox
step: 6
title: Enable the sandbox
lead: The dependency installation and system configuration require your normal sudo-enabled account. Exit the `claude` shell first.
---

```bash title="WSL — return to your normal user"
exit
sudo apt update
sudo apt install -y bubblewrap socat
```

### Ubuntu 24.04 and later: check AppArmor

```bash title="WSL — your normal user"
sysctl kernel.apparmor_restrict_unprivileged_userns
```

If the command returns `1`, allow unprivileged user namespaces:

```bash title="WSL — your normal user"
echo 'kernel.apparmor_restrict_unprivileged_userns = 0' | \
  sudo tee /etc/sysctl.d/99-claude-sandbox.conf
sudo sysctl --system
```

> [!WARNING]
> This relaxes a system-wide hardening setting. On a dedicated development machine that may be an acceptable tradeoff. A targeted AppArmor profile for Bubblewrap is the more surgical option.

### Start Claude Code in the repository

```bash title="WSL — switch to claude"
sudo -iu claude
cd /home/{{USERNAME}}/git/{{REPO}}
claude
```

The first run opens an Anthropic sign-in flow. In WSL, the browser commonly opens on Windows and gives you a code to paste back into the terminal. This authentication belongs to the `claude` Linux account and is stored in that user's home directory.

Inside Claude Code, run:

```text title="Claude Code"
/sandbox
```

The sandbox panel reports whether `ripgrep`, `bubblewrap`, `socat`, and the optional seccomp filter are available.

- **Auto-allow:** sandboxed commands run without prompting; operations that need to escape the sandbox fall back to a normal permission prompt.
- **Regular permissions:** the sandbox remains enabled, but each command still prompts.

The sandbox grants read/write access to the working directory and routes network access through an allowlist proxy.

---
id: step7
nav: 7. Lock down WSL
step: 7
title: Restrict Windows access and make claude the default user
lead: By default, every Linux user — including the `claude` account — can read your Windows drives under `/mnt/c` and launch Windows programs as your Windows user. These settings close both paths and make WSL open as `claude` instead of your sudo-enabled account.
---

```bash title="WSL — your normal user"
sudo nano /etc/wsl.conf
```

Add these sections. Keep any other sections already in the file (for example `[boot]`); if it already has a `[user]` section, change its `default` line rather than adding a second one:

```bash title="/etc/wsl.conf"
[boot]
systemd=true #can fail when other WSL instances are running

[user]
default=claude 

# Must be the designated, hardened claude user, 
# othewise Win Desktop Claude Code,
# will have the other/normal/standard user's perms

[automount]
enabled = false
options = "metadata,umask=777" 

# Default user is claude. If human user needs to access /mnt/c, then try 707. 
# 707 will disallow default/claude user, 
# while allow others in the group and denies those outside of group. 
# Assumption: claude and human are same group
# Note that the claude group (agentic) must be 1000. 
# In our current config, it winds up being 1001 and that won't work; 
# all users still denied. 


[interop]
appendWindowsPath = false 
enabled = true 

# When disabled, "code" command for vsCode in WSL will NOT launch VS Code in Windows. 
# Claude agent spawn from Win Claude Desktop will also fail.

```

Restart WSL so the changes take effect, then reopen Ubuntu. You'll now be signed in as `claude`:

```powershell title="PowerShell"
wsl --shutdown
```

> [!TIP]
> For admin work later, open your normal account from PowerShell with `wsl -u {{USERNAME}}`.

> [!NOTE]
> With interop disabled, WSL can no longer launch Windows programs. Commands such as `code .` and `explorer.exe .` stop working from the Ubuntu terminal. To edit in VS Code, open the folder from the Windows side instead (WSL extension → **Connect to WSL**).

---
id: step8
nav: 8. Day-to-day use
step: 8
title: Day-to-day use
---

- [x] Edit files in VS Code or another editor as your normal user.
- [x] Run Claude Code as the `claude` user, confined to the repository.
- [x] Shared group ownership, setgid directories, and `umask 002` keep files writable by both accounts.

Add this shortcut to your normal account's `~/.bashrc`:

```bash title="WSL — your normal user"
alias cc='sudo -iu claude bash -c "cd /home/{{USERNAME}}/git/{{REPO}} && claude"'
```

Reload your shell, then launch with `cc`:

```bash title="WSL"
source ~/.bashrc
cc
```

---
id: gotchas
nav: Notes & gotchas
title: Notes and gotchas
---

- **Keep secrets outside the repository.** The agent has full access to its working tree, and Git hooks may execute during Git operations.
- **Do not run Claude Code from native PowerShell.** The Linux sandbox described here does not apply there.
- **Build-tool permissions should remain stable.** Setgid plus `umask 002` keeps files created by tools such as `npm install` and Next.js builds group-writable. Because this setup uses group inheritance rather than ACLs, there is no ACL mask to collapse and usually nothing to repair afterward.
- **Enterprise enforcement is possible.** Organization administrators can centrally require the sandbox rather than leaving it as a per-developer choice, using managed settings such as `enabled` and `failIfUnavailable`.
- **Windows Git Credential Manager won't work from WSL.** With interop disabled, a Git `credential.helper` that points at the Windows `git-credential-manager.exe` can't run. Use SSH keys or a Linux-side credential helper instead.
- **Usage limits are shared.** CLI, desktop, and web sessions draw from the same account usage allowance.

---
id: appendix-coco
nav: "Appendix A: Snowflake CoCo"
title: Snowflake Cortex Code aka CoCo
eyebrow: Appendix A
---

> [!NOTE]
> **Scratchy notes**

For example, `{{USERNAME_UPPER}}_CODE`.

```sql title="Snowflake SQL"

  type = service
  default_role='{{USERNAME_UPPER}}_CODE_ROLE'

  ROLE_RESTRICTION = {{USERNAME_UPPER}}_CODE_ROLE

### 2. Install the CLI

Install the CLI per [Snowflake Cortex Code](https://www.snowflake.com/en/product/snowflake-coco/).

### 3. Run `cortex` via the `claude` user in WSL2

```text title="Example connection"
Account: URSAHEALTH-URSADEVAWS
User: {{USERNAME_UPPER}}_CODE
Current Auth: PAT
```

### 4. Threat-model conclusion

Determine resignedly that CoCo does not solve the threat model problem of running Claude Code with a PAT into Snowflake. Indeed, CoCo CLI is basically just Claude Code with a PAT into Snowflake and a bunch of Snowflake-specific skills.

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  /* =================================================================
     Markdown -> HTML
     A small renderer for the subset of Markdown the guide uses.
     All text is HTML-escaped, so raw HTML in Markdown shows as text.
     ================================================================= */

  /** Blocks "javascript:" and other odd schemes; allows http(s), mailto, anchors, relative paths. */
  function safeUrl(url) {
    return /^[a-z][a-z0-9+.-]*:/i.test(url) && !/^(https?|mailto):/i.test(url) ? '#' : url;
  }

  function renderInline(text) {
    var codes = [];
    // Pull out `code spans` first so nothing inside them is treated as Markdown.
    var s = text.replace(/(`+)([\s\S]*?[^`])\1(?!`)/g, function (_, ticks, code) {
      codes.push('<code class="inline">' + escapeHtml(code.replace(/^ ([\s\S]*) $/, '$1')) + '</code>');
      return '\u0000' + (codes.length - 1) + '\u0000';
    });
    s = escapeHtml(s);
    // \* \_ etc. -> literal characters
    s = s.replace(/\\([\\`*_{}\[\]()#+\-.!])/g, function (_, ch) {
      codes.push(ch);
      return '\u0000' + (codes.length - 1) + '\u0000';
    });
    // [text](url)
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (_, label, url) {
      var href = safeUrl(url);
      var external = /^https?:\/\//i.test(href) ? ' target="_blank" rel="noopener noreferrer"' : '';
      return '<a href="' + href + '"' + external + '>' + label + '</a>';
    });
    s = s.replace(/\*\*(?=\S)([\s\S]*?\S)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^\w])__(?=\S)([\s\S]*?\S)__(?!\w)/g, '$1<strong>$2</strong>');
    s = s.replace(/\*(?=\S)([^*]*?\S)\*/g, '<em>$1</em>');
    // _italic_ only at word edges, so names like {{USERNAME_UPPER}}_CODE are left alone.
    s = s.replace(/(^|[^\w])_(?=\S)([^_]*?\S)_(?!\w)/g, '$1<em>$2</em>');
    // Hard line breaks: two trailing spaces or a trailing backslash.
    s = s.replace(/( {2,}|\\)\n/g, '<br>\n');
    return s.replace(/\u0000(\d+)\u0000/g, function (_, i) { return codes[Number(i)]; });
  }

  var FENCE_RE = /^ {0,3}(`{3,}|~{3,})(.*)$/;
  var HEADING_RE = /^ {0,3}(#{1,6})\s+(.*?)(\s+#+)?\s*$/;
  var HR_RE = /^ {0,3}([-*_])(\s*\1){2,}\s*$/;
  var QUOTE_RE = /^ {0,3}>/;
  var LIST_RE = /^( {0,3})([-*+]|\d{1,9}[.)])( +|$)/;

  function startsBlock(line) {
    return FENCE_RE.test(line) || HEADING_RE.test(line) || HR_RE.test(line) || QUOTE_RE.test(line) || LIST_RE.test(line);
  }

  function leadingSpaces(line) {
    return line.match(/^ */)[0].length;
  }

  function renderFence(info, code) {
    var lang = (info.split(/\s+/)[0] || 'text').toLowerCase();
    var title = (info.match(/title="([^"]*)"/) || [])[1] || lang;
    return (
      '<div class="code-wrap"><span class="code-label">' + escapeHtml(title) + '</span>' +
      '<button type="button" class="copy">Copy</button>' +
      '<pre><code data-lang="' + escapeHtml(lang) + '">' + escapeHtml(code) + '</code></pre></div>'
    );
  }

  function renderQuote(lines) {
    var m = lines[0].match(/^\s*\[!(\w+)\]\s*(.*)$/);
    var cls = m && CALLOUTS[m[1].toUpperCase()];
    if (cls) {
      var rest = (m[2] ? [m[2]] : []).concat(lines.slice(1));
      return '<div class="' + cls + '">' + renderBlocks(rest.join('\n')) + '</div>';
    }
    return '<blockquote>' + renderBlocks(lines.join('\n')) + '</blockquote>';
  }

  /** Reads one list starting at lines[i]; returns [html, nextIndex]. */
  function renderList(lines, i) {
    var first = lines[i].match(LIST_RE);
    var ordered = /\d/.test(first[2]);
    var items = [];
    var loose = false;

    while (i < lines.length) {
      var m = lines[i].match(LIST_RE);
      if (!m || /\d/.test(m[2]) !== ordered) break;
      var indent = m[1].length + m[2].length + Math.max(1, Math.min(m[3].length, 4));
      var item = [lines[i].slice(indent)];
      i++;
      while (i < lines.length) {
        var line = lines[i];
        if (!line.trim()) {
          // A blank line continues the item only if indented content follows.
          var j = i;
          while (j < lines.length && !lines[j].trim()) j++;
          if (j < lines.length && leadingSpaces(lines[j]) >= indent) {
            for (; i < j; i++) item.push('');
            continue;
          }
          break;
        }
        if (leadingSpaces(line) >= indent) { item.push(line.slice(indent)); i++; continue; }
        if (startsBlock(line)) break;
        item.push(line.trim()); // lazy paragraph continuation
        i++;
      }
      items.push(item);

      // Blank lines between items make it a "loose" list (items wrapped in <p>).
      var k = i;
      while (k < lines.length && !lines[k].trim()) k++;
      if (k > i && k < lines.length) {
        var next = lines[k].match(LIST_RE);
        if (next && /\d/.test(next[2]) === ordered) { loose = true; i = k; continue; }
      }
      if (k > i) break;
    }

    var checklist = !ordered && items.every(function (it) { return /^\[[ xX]\]\s+/.test(it[0]); });
    var tag = ordered ? 'ol' : 'ul';
    var start = ordered && parseInt(first[2], 10) !== 1 ? ' start="' + parseInt(first[2], 10) + '"' : '';
    var html = '<' + tag + start + (checklist ? ' class="checklist"' : '') + '>' +
      items.map(function (it) {
        if (checklist) it[0] = it[0].replace(/^\[[ xX]\]\s+/, '');
        return '<li>' + renderBlocks(it.join('\n'), !loose) + '</li>';
      }).join('') +
      '</' + tag + '>';
    return [html, i];
  }

  /** Block-level Markdown. tight=true leaves paragraphs unwrapped (for tight list items). */
  function renderBlocks(src, tight) {
    var lines = src.replace(/\r\n?/g, '\n').replace(/\t/g, '    ').split('\n');
    var out = [];
    var i = 0;
    var m;

    while (i < lines.length) {
      var line = lines[i];

      if (!line.trim()) { i++; continue; }

      if ((m = line.match(FENCE_RE))) {
        var close = new RegExp('^ {0,3}' + (m[1][0] === '`' ? '`' : '~') + '{' + m[1].length + ',}\\s*$');
        var body = [];
        i++;
        while (i < lines.length && !close.test(lines[i])) body.push(lines[i++]);
        i++; // skip the closing fence
        out.push(renderFence(m[2].trim(), body.join('\n')));
        continue;
      }

      if ((m = line.match(HEADING_RE))) {
        var n = m[1].length;
        out.push('<h' + n + '>' + renderInline(m[2]) + '</h' + n + '>');
        i++;
        continue;
      }

      if (HR_RE.test(line)) { out.push('<hr>'); i++; continue; }

      if (QUOTE_RE.test(line)) {
        var quote = [];
        while (i < lines.length && QUOTE_RE.test(lines[i])) quote.push(lines[i++].replace(/^ {0,3}> ?/, ''));
        out.push(renderQuote(quote));
        continue;
      }

      if (LIST_RE.test(line)) {
        var list = renderList(lines, i);
        out.push(list[0]);
        i = list[1];
        continue;
      }

      var para = [];
      while (i < lines.length && lines[i].trim() && !startsBlock(lines[i])) para.push(lines[i++].replace(/^\s+/, ''));
      var inline = renderInline(para.join('\n').replace(/\s+$/, ''));
      out.push(tight ? inline : '<p>' + inline + '</p>');
    }
    return out.join('\n');
  }

  /** Tiny frontmatter parser (flat key: value only). */
  /**
   * Splits one Markdown block into sections. A section starts at a "---" line
   * followed by "key: value" lines (including id:) and a closing "---".
   * Lines inside ``` code fences are never treated as frontmatter.
   */
  function splitSections(raw, n) {
    var lines = raw.replace(/\r\n?/g, '\n').split('\n');
    var starts = [];
    var fence = null;
    for (var i = 0; i < lines.length; i++) {
      var f = lines[i].match(/^ {0,3}(`{3,}|~{3,})/);
      if (f) {
        if (!fence) fence = f[1];
        else if (f[1][0] === fence[0] && f[1].length >= fence.length && /^\s*[`~]+\s*$/.test(lines[i])) fence = null;
        continue;
      }
      if (fence || lines[i].trim() !== '---') continue;
      var j = i + 1;
      var hasId = false;
      while (j < lines.length && /^[A-Za-z]+:/.test(lines[j])) { if (/^id:/.test(lines[j])) hasId = true; j++; }
      if (hasId && j < lines.length && lines[j].trim() === '---') { starts.push(i); i = j; }
    }
    if (!starts.length) throw new Error('Markdown block ' + n + ': no frontmatter found (each section starts with --- / id: ... / ---)');
    if (lines.slice(0, starts[0]).join('').trim()) throw new Error('Markdown block ' + n + ': text before the first frontmatter');
    return starts.map(function (start, k) {
      return lines.slice(start, k + 1 < starts.length ? starts[k + 1] : lines.length).join('\n');
    });
  }

  function parseSection(raw, where) {
    var m = raw.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
    if (!m) throw new Error(where + ': missing frontmatter block');
    var meta = {};
    m[1].split(/\r?\n/).forEach(function (line) {
      if (!line.trim()) return;
      var kv = line.match(/^([A-Za-z]+):\s*(.*)$/);
      if (!kv) throw new Error(where + ': bad frontmatter line "' + line + '"');
      meta[kv[1]] = kv[2].replace(/^"(.*)"$/, '$1');
    });
    ['id', 'nav', 'title'].forEach(function (key) {
      if (!meta[key]) throw new Error(where + ': frontmatter needs "' + key + '"');
    });
    if (!/^[a-z0-9-]+$/.test(meta.id)) throw new Error(where + ': id must be lowercase letters, digits, dashes');
    return {
      id: meta.id,
      nav: meta.nav,
      title: meta.title,
      step: meta.step,
      eyebrow: meta.eyebrow,
      leadHtml: meta.lead ? renderInline(meta.lead) : '',
      html: renderBlocks(m[2]),
    };
  }

  /* =================================================================
     Page
     ================================================================= */

  /** Only these characters reach the page, so substituted values can never inject markup. */
  function safeValue(value, fallback) {
    return String(value || '').trim().replace(/[^A-Za-z0-9._-]/g, '') || fallback;
  }

  function applyTemplate(html, username, repo) {
    return html
      .split('{{USERNAME_UPPER}}').join(username.toUpperCase())
      .split('{{USERNAME_LOWER}}').join(username.toLowerCase())
      .split('{{USERNAME}}').join(username)
      .split('{{REPO}}').join(repo);
  }

  function loadSettings() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch (e) { return {}; }
  }

  function saveSettings(settings) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(settings)); } catch (e) { /* storage blocked */ }
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return legacyCopy(text); });
    }
    return Promise.resolve(legacyCopy(text));
  }

  // Clipboard API needs https or localhost; this fallback also works from file://.
  function legacyCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  function sectionHtml(s, u, r) {
    var titleId = s.id + '-title';
    var title = '<h2 id="' + titleId + '">' + escapeHtml(s.title) + '</h2>';
    var lead = s.leadHtml ? '<p>' + applyTemplate(s.leadHtml, u, r) + '</p>' : '';
    var head = s.step
      ? '<div class="step-header"><div class="step-number" aria-hidden="true">' + escapeHtml(s.step) + '</div>' +
        '<div>' + title + lead + '</div></div>'
      : title + lead;
    return (
      '<section class="card' + (s.eyebrow ? ' appendix' : '') + '" id="' + s.id + '" data-section="' + s.id + '" aria-labelledby="' + titleId + '">' +
      (s.eyebrow ? '<div class="eyebrow appendix-eyebrow">' + escapeHtml(s.eyebrow) + '</div>' : '') +
      head +
      '<div class="card-body">' + applyTemplate(s.html, u, r) + '</div>' +
      '</section>'
    );
  }

  var app = document.getElementById('wsl-guide');
  app.innerHTML =
    '<div class="shell">' +
      '<header class="hero">' +
        '<div class="eyebrow">' + escapeHtml(CONFIG.eyebrow) + '</div>' +
        '<h1>' + escapeHtml(CONFIG.title) + '</h1>' +
        '<p>' + escapeHtml(CONFIG.description) + '</p>' +
      '</header>' +
      '<section class="config" aria-labelledby="wsl-guide-config-title">' +
        '<h2 id="wsl-guide-config-title">Customize this guide</h2>' +
        '<p class="config-note">Change these values once. Every affected path and command below updates automatically.</p>' +
        '<div class="fields">' +
          '<label>Windows / WSL username<input data-field="username" spellcheck="false" autocomplete="off"></label>' +
          '<label>Repository name<input data-field="repo" spellcheck="false" autocomplete="off"></label>' +
        '</div>' +
        '<div class="path-preview">Resolved repository path: <strong data-path-preview></strong></div>' +
      '</section>' +
      '<div class="layout">' +
        '<nav aria-label="Guide navigation"><strong>Contents</strong><div data-nav></div></nav>' +
        '<div class="guide-main" data-main></div>' +
      '</div>' +
    '</div>';

  // Look things up inside the guide only, so nothing collides with the host page.
  var userInput = app.querySelector('[data-field="username"]');
  var repoInput = app.querySelector('[data-field="repo"]');
  var pathPreview = app.querySelector('[data-path-preview]');
  var navEl = app.querySelector('[data-nav]');
  var mainEl = app.querySelector('[data-main]');

  var sections = [];
  try {
    Array.prototype.forEach.call(document.querySelectorAll('script[type="text/markdown"]'), function (el, i) {
      splitSections(el.textContent, i + 1).forEach(function (text, k) {
        var s = parseSection(text, 'Markdown block ' + (i + 1) + ', section ' + (k + 1));
        if (sections.some(function (o) { return o.id === s.id; })) throw new Error('duplicate section id "' + s.id + '"');
        sections.push(s);
      });
    });
  } catch (err) {
    mainEl.innerHTML = '<div class="status">Could not render the guide: ' + escapeHtml(err.message) + '</div>';
    throw err;
  }

  var stored = loadSettings();
  userInput.value = stored.username || CONFIG.defaultUsername;
  repoInput.value = stored.repo || CONFIG.defaultRepo;

  navEl.innerHTML = sections.map(function (s) {
    return '<a href="#' + s.id + '" data-target="' + s.id + '">' + escapeHtml(s.nav) + '</a>';
  }).join('');

  function setActive(id) {
    Array.prototype.forEach.call(navEl.querySelectorAll('a'), function (a) {
      a.classList.toggle('active', a.getAttribute('data-target') === id);
    });
  }

  // Highlight the TOC entry for the section currently in view.
  var observer = null;
  function observeSections() {
    if (observer) observer.disconnect();
    if (typeof IntersectionObserver === 'undefined') return;
    var els = Array.prototype.slice.call(mainEl.querySelectorAll('[data-section]'));
    var visible = {};
    observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { visible[e.target.getAttribute('data-section')] = e.isIntersecting; });
      var first = els.filter(function (el) { return visible[el.getAttribute('data-section')]; })[0];
      if (first) setActive(first.getAttribute('data-section'));
    }, { rootMargin: '-10% 0px -65% 0px' });
    els.forEach(function (el) { observer.observe(el); });
  }

  function render() {
    var u = safeValue(userInput.value, CONFIG.defaultUsername);
    var r = safeValue(repoInput.value, CONFIG.defaultRepo);
    pathPreview.textContent = '/home/' + u + '/git/' + r;
    mainEl.innerHTML = sections.map(function (s) { return sectionHtml(s, u, r); }).join('');
    saveSettings({ username: userInput.value, repo: repoInput.value });
    observeSections();
  }

  userInput.addEventListener('input', render);
  repoInput.addEventListener('input', render);

  navEl.addEventListener('click', function (e) {
    var a = e.target.closest('a[data-target]');
    if (!a) return;
    // Scroll in place only: no URL or history changes, which fail when the page
    // is hosted without a normal site origin (e.g. inside SharePoint).
    e.preventDefault();
    var id = a.getAttribute('data-target');
    var target = mainEl.querySelector('[data-section="' + id + '"]');
    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    setActive(id);
  });

  // One handler for every Copy button.
  mainEl.addEventListener('click', function (e) {
    var button = e.target.closest('button.copy');
    if (!button) return;
    copyText(button.parentElement.querySelector('code').textContent).then(function (ok) {
      button.textContent = ok ? 'Copied' : 'Copy failed';
      setTimeout(function () { button.textContent = 'Copy'; }, 1200);
    });
  });

  render();
  if (sections.length) setActive(sections[0].id);
})();
</script>
</body>
</html>
