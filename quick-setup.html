---
id: intro
nav: Introduction
title: About this guide
---

This is the scripted version of the [full setup guide](index.html). It ends with the same setup: Claude Code runs in WSL as a restricted `claude` user behind a proxy and the Claude Code sandbox, and you edit in VS Code as your normal user. A script, `setup-wsl.sh`, runs inside Ubuntu and does Steps 2 to 10 of the full guide, so this guide has fewer steps. The Windows side of connecting VS Code stays manual: a few PowerShell commands in Steps 2 and 5.

The full guide stays as the reference: it explains each setting the script applies, and you can follow it by hand instead.

> [!WARNING]
> **Approval first:** before proceeding to Step 1, get the appropriate approvals from IT; otherwise ThreatLocker will block the setup.

> [!NOTE]
> **Prerequisites:** before starting Step 1:
>
> - Install [Claude Desktop](https://claude.ai/download) on Windows. This guide doesn't cover installing it.
> - **IT:** confirm your Claude seat includes Claude Code, and enable WSL sessions in Claude Desktop. Desktop turns WSL sessions off by default on organization-managed devices; IT turns them on by setting the `disableWslSessions` value under `HKLM\SOFTWARE\Policies\Claude` to `false` (Claude Desktop v1.19367.0 or later).
> - Install [VS Code](https://code.visualstudio.com/) on Windows.
> - Have the AWS access key ID and secret access key from IT ready for the New-Forge IAM user. You can also skip them and add them later.

---
id: step1
nav: 1. Install WSL2
step: 1
title: Install WSL2 and Ubuntu from Windows
lead: The script runs inside Ubuntu, so install WSL and Ubuntu by hand first. Open **PowerShell as Administrator**.
---

Install WSL itself, without a Linux distribution:

```powershell title="PowerShell"
wsl --install --no-distribution
```

Reboot if prompted, then install Ubuntu 26.04:

```powershell title="PowerShell"
wsl --install Ubuntu-26.04
```

Reboot when prompted, then choose a local username and password for Ubuntu.

> [!TIP]
> Ubuntu asks for the username and password in the terminal window when it first starts, not in a separate Windows dialog. Use the same username you entered as **WSL username** under **Customize this guide** so the commands below match. You may consider a shorter name for ease of keyboard entry.

Leave the Ubuntu terminal open. You're signed in as your normal user, which is the account the script runs as.

---
id: step2
nav: 2. Prepare Windows
step: 2
title: Create the VS Code key and download the script
lead: Open a normal **PowerShell** window, not as Administrator.
---

### Create an SSH key for VS Code

VS Code uses this key to connect to WSL as your normal user. When asked for a passphrase, press **Enter** twice to leave it empty. The key only opens connections to WSL on this computer (`127.0.0.1:2222`), so a passphrase adds little protection, and without one VS Code connects without prompting.

```powershell title="PowerShell"
New-Item -ItemType Directory -Force "$env:USERPROFILE\.ssh" | Out-Null
ssh-keygen -t ed25519 -C "$env:USERNAME-vscode" -f "$env:USERPROFILE\.ssh\wsl-vscode"
```

Show the public key:

```powershell title="PowerShell"
Get-Content "$env:USERPROFILE\.ssh\wsl-vscode.pub"
```

It's one line that starts with `ssh-ed25519`. Leave this window open: the WSL script asks you to paste that line in Step 3.

### Download the script

Download [setup-wsl.sh](setup-wsl.sh) into your Windows **Downloads** folder, from the same place as this guide. If your browser opens it as text instead of downloading it, right-click the link and choose **Save link as**. Keep the file name as it is.

---
id: step3
nav: 3. Run the WSL script
step: 3
title: Run the WSL script
lead: Run these in the Ubuntu terminal as your normal user, not as `claude` and not with `sudo`.
---

### Copy the script into WSL

This copies `setup-wsl.sh` from your Windows Downloads folder into your Linux home folder. It also removes any Windows line endings, which would otherwise stop bash with `$'\r': command not found`:

```bash title="WSL — your normal user"
win_home=$(wslpath "$(/mnt/c/Windows/System32/cmd.exe /c 'echo %USERPROFILE%' 2>/dev/null | tr -d '\r')")
cp "$win_home/Downloads/setup-wsl.sh" ~/
sed -i 's/\r$//' ~/setup-wsl.sh
```

Copy it now: once the script finishes and WSL restarts, WSL can no longer see your Windows drives.

### Run it

```bash title="WSL — your normal user"
REPO={{REPO}} GITHUB_USER={{GITHUB_USER}} bash ~/setup-wsl.sh
```

The values in front of `bash` come from **Customize this guide**. They apply to this one run.

The script stops four times for your input:

1. **Your Ubuntu password,** once, for `sudo`.
2. **GitHub,** if GitHub doesn't accept the new SSH key yet. The script prints the key, copies it to your Windows clipboard, and waits. In a browser, signed in as `{{GITHUB_USER}}`:
   1. Open **Settings → SSH and GPG keys → New SSH key** and paste the key with **Ctrl+V**. If you've copied something else since, type `c` and press **Enter** at the script's prompt to copy the key again.
   2. Fork [ursahealth/{{REPO}}](https://github.com/ursahealth/{{REPO}}) into `{{GITHUB_USER}}` if you haven't already.

   Then press **Enter**. The script tests the connection again and clones the repository once it works.
3. **VS Code key:** paste the `ssh-ed25519` line from Step 2. The script adds it to your `~/.ssh/authorized_keys`. Leave it blank to skip; the script then tells you how to add it later.
4. **AWS keys:** paste the access key ID, then the secret access key. The secret stays hidden while you paste. Afterward the script shows only its length and last 4 characters. If either value has the wrong format, it asks again. Leave the key ID blank to skip AWS for now.

Everything else runs on its own. When it's done, the script prints the remaining manual steps, which are Steps 4 to 7 below.

### What it sets up

| Full guide step | What the script does |
|---|---|
| 2 | Creates a GitHub SSH key with no passphrase, and clones your fork into `~/git/{{REPO}}` |
| 3 | Creates the `agentic` group and the `claude` user |
| 4 | Shares the repository with `claude`, and mounts it at `/home/claude/{{REPO}}` |
| 5 | Installs Claude Code for `claude`, and makes `claude`'s shells start in the repository |
| 6 | Sets up the Squid proxy and the iptables rules |
| 7 | Installs the sandbox tools and the managed settings |
| 8 | Writes `/etc/wsl.conf`, which takes effect after the restart in Step 4 |
| 9 | Sets up the SSH server for VS Code, and authorizes the VS Code key |
| 10 | Installs Node.js, the npm packages, the Python environment with SQLMesh and DuckDB, and your AWS credentials |

### Settings

| Setting | Default | How to change it |
|---|---|---|
| `REPO` | `new-forge` | Put it in front of the command, as above |
| `GITHUB_USER` | None; the script asks for it | Put it in front of the command, as above |
| `SQUID_MODE` | `open`: `claude` can reach any domain through the proxy | Put `SQUID_MODE=allowlist` in front of the command to allow only the domains in `/etc/squid/allowed-domains.txt` |
| Node.js, SQLMesh and DuckDB versions | The versions in the full guide | Edit the settings block at the top of `setup-wsl.sh` |

For example, the production allowlist:

```bash title="WSL — your normal user"
SQUID_MODE=allowlist REPO={{REPO}} GITHUB_USER={{GITHUB_USER}} bash ~/setup-wsl.sh
```

### If the script stops with an error

Each step prints a heading such as `==> Step 10: Node.js, npm packages, Python environment`. Fix the cause, then start again at the step that failed by adding `--from` and that step's number. For example, for Step 10:

```bash title="WSL — your normal user"
REPO={{REPO}} GITHUB_USER={{GITHUB_USER}} bash ~/setup-wsl.sh --from 10
```

The script skips the earlier steps and runs the failed step and every step after it. The steps run in this order: `packages 2 3 4 5 6 7 9 10 8`. Step 8 runs last on purpose: it makes `claude` the default user and turns off your Windows drives at the next restart, so it only runs once everything else has succeeded. Starting at `--from 10` therefore runs Steps 10 and 8.

To run a single step only, use `--only` instead, for example `--only 6`. If you're not sure which step failed, run the command without `--from`: every step checks what's already done and skips it, so a full re-run is also safe, just slower.

---
id: step4
nav: 4. Restart WSL
step: 4
title: Restart WSL
lead: The new `/etc/wsl.conf` only takes effect after WSL restarts.
---

Exit WSL to return to PowerShell:

```bash title="WSL — your normal user"
exit
```

Shut WSL down:

```powershell title="PowerShell"
wsl --shutdown
```

WSL now opens as `claude` by default, without access to your Windows drives.

> [!NOTE]
> **Only if the script said** "systemd isn't running yet": the SSH server for VS Code still needs setting up. Open WSL as your normal user:
>
> ```powershell title="PowerShell"
> wsl -u {{USERNAME}}
> ```
>
> Run the script again; it skips what's already done:
>
> ```bash title="WSL — your normal user"
> REPO={{REPO}} GITHUB_USER={{GITHUB_USER}} bash ~/setup-wsl.sh
> ```
>
> Then exit to PowerShell:
>
> ```bash title="WSL — your normal user"
> exit
> ```

---
id: step5
nav: 5. Connect VS Code
step: 5
title: Connect VS Code as your normal user
lead: Run these in a normal PowerShell window, not as Administrator. VS Code connects to WSL over SSH, so your edits and commits are made as your normal account, not as `claude`.
---

### Add an SSH host entry on Windows

```powershell title="PowerShell"
Add-Content "$env:USERPROFILE\.ssh\config" @"

Host wsl
  HostName 127.0.0.1
  Port 2222
  User {{USERNAME}}
  IdentityFile ~/.ssh/wsl-vscode
"@
```

Test the connection. Accept the host fingerprint on first connect; the command should print your normal username:

```powershell title="PowerShell"
ssh wsl whoami
```

### Install Remote - SSH and connect

```powershell title="PowerShell"
code --install-extension ms-vscode-remote.remote-ssh
```

In VS Code, open the Command Palette, run **Remote-SSH: Connect to Host…**, and choose `wsl`. Then use **File → Open Folder** to open `/home/{{USERNAME}}/git/{{REPO}}`.

> [!WARNING]
> Don't open the repository with VS Code's WSL extension or with `code .` from the Ubuntu terminal; both connect as `claude`. Use Remote - SSH as your normal user.

> [!TIP]
> In later VS Code sessions, start WSL before you connect: type `wsl` in PowerShell and leave that window open. WSL shuts down shortly after its last terminal closes, and that also stops the SSH server, so Remote - SSH can't connect until WSL is running again.

---
id: step6
nav: 6. Sign in to Claude Code
step: 6
title: Sign in to Claude Code as claude
lead: The first `claude` run signs the `claude` Linux account in to Anthropic.
---

Start WSL from PowerShell. It opens as `claude`, in the repository:

```powershell title="PowerShell"
wsl
```

```bash title="WSL — as claude"
claude
```

The first run opens an Anthropic sign-in flow. In WSL, the browser commonly opens on Windows and gives you a code to paste back into the terminal. This authentication belongs to the `claude` Linux account and is stored in that user's home directory.

Inside Claude Code, run:

```text title="Claude Code"
/sandbox
```

The sandbox panel reports whether `ripgrep`, `bubblewrap`, `socat`, and the optional seccomp filter are available.

- **Auto-allow:** sandboxed commands run without prompting; operations that need to escape the sandbox fall back to a normal permission prompt.
- **Regular permissions:** the sandbox remains enabled, but each command still prompts.

Quit Claude Code:

```text title="Claude Code"
/exit
```

Then leave WSL:

```bash title="WSL — as claude"
exit
```

---
id: step7
nav: 7. Verify Claude Desktop
step: 7
title: Verify Claude Desktop runs as claude
lead: Confirm that Claude Desktop's Claude Code sessions run inside WSL as the restricted `claude` user, with the managed settings applied.
---

### Start a WSL session

1. In Claude Desktop, open the **Code** tab and start a new session.
2. In the environment selector under the prompt box, choose your Ubuntu distribution under **WSL**.
3. Choose the session's folder. Claude Desktop opens a Windows folder dialog that browses inside WSL as `claude`, starting in `claude`'s home, `/home/claude`. Open the `{{REPO}}` folder there, which is the mount the script created, and select it. Don't browse to `/home/{{USERNAME}}`; `claude` can't list your home, so the repository can't be reached that way.
4. Trust the folder when asked.

The first session in a distribution takes a little longer while Claude sets up inside it.

> [!NOTE]
> If **WSL** is grayed out with **Disabled by your organization**, IT hasn't enabled WSL sessions yet; see the prerequisites in the introduction.

> [!NOTE]
> **If the session can't write to the repository:** see the note in Step 11 of the [full guide](index.html).

### Check the user

Send this prompt. The answer should be `claude`:

```text title="Claude Desktop — Code tab"
Run whoami and show me the output.
```

### Check the managed settings

Run this in the session. The `Setting sources` line should list `Enterprise managed settings (file)`:

```text title="Claude Desktop — Code tab"
/status
```

### Check the isolation

Send this prompt. The command should fail with `Permission denied`, because `claude` can't read your AWS credentials:

```text title="Claude Desktop — Code tab"
Run ls /home/{{USERNAME}}/.aws and show me the output.
```

> [!WARNING]
> Don't use the session's **Open in editor** button. It opens VS Code through the WSL extension, which connects as `claude`. Edit in VS Code through Remote - SSH instead (Step 5).

id: appendix-values
nav: "Appendix A: Setup values"
title: Every value the setup needs
eyebrow: Appendix A
---

All the values you enter or choose during setup, roughly in the order you need them. **Where** names the exact screen, prompt or file.

### Before you start (IT and accounts)

| Value | Example / default | Where | Notes |
|---|---|---|---|
| IT approval for the setup | n/a | ThreatLocker, managed by IT | Without it, ThreatLocker blocks the installs and the script |
| `disableWslSessions` = `false` | Registry value under `HKLM\SOFTWARE\Policies\Claude` | **Windows**: registry, set by IT | Turns on WSL sessions in Claude Desktop v1.19367.0 or later |
| Claude seat that includes Claude Code | Your Ursa Claude account | **Web**: claude.ai, with IT confirming | Used to sign in the `claude` account in Step 6 |
| GitHub username (personal Ursa account) | `{{GITHUB_USER}}` | **Web**: github.com account | Becomes `GITHUB_USER` |
| AWS IAM user for New-Forge | Access key ID `AKIA…` (20 characters) and secret (40 characters) | **Web**: AWS IAM console, created by IT and added to `ursa-forge-group` | IT gives you the two keys; you paste them in Step 3 |

### This guide

| Value | Example / default | Where | Notes |
|---|---|---|---|
| WSL username | `{{USERNAME}}` | **Browser**: "Customize this guide" on this page | Must match the Ubuntu username you create in Step 1 |
| Repository name | `{{REPO}}` | **Browser**: same form | Fills in `REPO` in the commands |
| GitHub username | `{{GITHUB_USER}}` | **Browser**: same form | Fills in `GITHUB_USER` in the commands |

### Step 1: install WSL and Ubuntu

| Value | Example / default | Where | Notes |
|---|---|---|---|
| Distribution name | `Ubuntu-26.04` | **Windows**: PowerShell as Administrator, `wsl --install Ubuntu-26.04` | Fixed value |
| Ubuntu username | `{{USERNAME}}` | **WSL**: Ubuntu terminal, prompt on first start | Your normal Linux account |
| Ubuntu password | Yours | **WSL**: same prompt | Also the `sudo` password in Step 3 |

### Step 2: prepare Windows

Run in PowerShell, not as Administrator.

| Value | Example / default | Where | Notes |
|---|---|---|---|
| VS Code key passphrase | Empty: press Enter twice | **Windows**: `ssh-keygen` prompt in PowerShell | Creates `%USERPROFILE%\.ssh\wsl-vscode` and `wsl-vscode.pub` |
| VS Code public key | `ssh-ed25519 AAAA… yourwindowsname-vscode` | **Windows**: printed by `Get-Content` in PowerShell | You paste it into the WSL script in Step 3 |

### Step 3: the WSL script

Run in the Ubuntu terminal as your normal user.

| Value | Example / default | Where | Notes |
|---|---|---|---|
| `REPO` | Default `new-forge` | **WSL**: in front of the command | Optional |
| `GITHUB_USER` | No default | **WSL**: in front of the command, or the script's prompt | Required; the script asks if it's missing |
| `SQUID_MODE` | `open` (default) or `allowlist` | **WSL**: in front of the command | `allowlist` is for production |
| `--from STEP`, `--only STEP`, `--list` | `--from 10` | **WSL**: after the command | Optional. STEP is one of `packages 2 3 4 5 6 7 9 10 8` |
| `sudo` password | Your Ubuntu password | **WSL**: script prompt | Asked once |
| GitHub SSH public key | `ssh-ed25519 AAAA… {{GITHUB_USER}}@wsl` | **WSL**: the script prints it. **Web**: paste it at github.com → Settings → SSH and GPG keys → New SSH key | No passphrase. Any title works |
| Fork of the repository | `github.com/{{GITHUB_USER}}/{{REPO}}` | **Web**: [github.com/ursahealth/{{REPO}}](https://github.com/ursahealth/{{REPO}}) → **Fork**, owner `{{GITHUB_USER}}` | The script clones your fork |
| Press Enter to retest GitHub | n/a | **WSL**: script prompt | Repeats until GitHub accepts the key |
| VS Code public key | The `ssh-ed25519` line from Step 2 | **WSL**: script prompt | Added to `~/.ssh/authorized_keys`. Leave blank to skip; add it later with `--only 9` |
| AWS access key ID | `AKIA` plus 16 characters | **WSL**: script prompt | Leave blank to skip. Saved in `~/.aws/credentials` under `[default]` |
| AWS secret access key | 40 characters | **WSL**: script prompt, hidden | The script shows only its length and last 4 characters |
| `NVM_VERSION`, `SQLMESH_VERSION`, `DUCKDB_VERSION` | `v0.40.8`, `0.235.4`, `1.5.6` | **WSL**: settings block at the top of `setup-wsl.sh` | Change only by editing the file |
| Allowed domains | `.anthropic.com`, `.claude.ai`, `.claude.com` | **WSL**: `/etc/squid/allowed-domains.txt` | Used only with `SQUID_MODE=allowlist`. The script creates the file once and never overwrites it |

### Step 5: connect VS Code

Run in PowerShell, not as Administrator.

| Value | Example / default | Where | Notes |
|---|---|---|---|
| SSH host alias | `wsl`, meaning `127.0.0.1` port `2222`, user `{{USERNAME}}` | **Windows**: `%USERPROFILE%\.ssh\config`, added by the `Add-Content` command | VS Code connects to this name |
| Accept the host fingerprint | Type `yes` | **Windows**: `ssh wsl whoami` prompt in PowerShell | First connection only |
| Remote host and folder | Host `wsl`, folder `/home/{{USERNAME}}/git/{{REPO}}` | **Windows**: VS Code → Remote-SSH: Connect to Host… → File → Open Folder | |

### Step 6: Claude Code sign-in

| Value | Example / default | Where | Notes |
|---|---|---|---|
| Anthropic sign-in | Your Ursa Claude account | **Web**: browser on Windows, opened by `claude` running in **WSL** as `claude` | Paste the code from the browser back into the WSL terminal |
| Sandbox mode | Auto-allow or Regular permissions | **WSL**: `/sandbox` inside Claude Code | |

### Step 7: Claude Desktop

| Value | Example / default | Where | Notes |
|---|---|---|---|
| Environment | Your Ubuntu distribution, under **WSL** | **Windows**: Claude Desktop → Code tab → environment selector | |
| Session folder | `/home/claude/{{REPO}}` | **Windows**: Claude Desktop folder dialog | The mount the script created. Don't browse to `/home/{{USERNAME}}` |

### Set by the script (for reference)

| Value | Where it's set |
|---|---|
| Squid proxy `127.0.0.1:3128` | **WSL**: `/etc/squid/squid.conf`, `/etc/claude-code/managed-settings.json` and `claude`'s `~/.bashrc` |
| SSH server `127.0.0.1:2222` | **WSL**: `/etc/ssh/sshd_config.d/10-wsl.conf` |
| `agentic` group and `claude` user | **WSL** |
| Default user `claude`, Windows drives off | **WSL**: `/etc/wsl.conf` |

<div id="wsl-guide" class="wsl-guide"></div>

<!-- =====================================================================
     JS
     ===================================================================== -->
<script>
(function () {
  'use strict';

  /* ---------- page settings ---------- */
  var CONFIG = {
    eyebrow: 'Windows developer environment',
    title: 'Running Claude Code Safely in WSL2: Scripted Setup',
    description: 'The same setup as the full guide, with a script doing most of the steps.',
    defaultUsername: 'your-wsl-username',
    defaultRepo: 'your-repository',
    defaultGithubUser: 'yourname-ursa',
  };

  var STORAGE_KEY = 'wslGuide.settings.v1';
  var CALLOUTS = { NOTE: 'note', IMPORTANT: 'note', TIP: 'success', WARNING: 'warning', CAUTION: 'warning' };

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  /* =================================================================
     Markdown -> HTML
     A small renderer for the subset of Markdown the guide uses.
     All text is HTML-escaped, so raw HTML in Markdown shows as text.
     ================================================================= */

  /** Blocks "javascript:" and other odd schemes; allows http(s), mailto, anchors, relative paths. */
  function safeUrl(url) {
    return /^[a-z][a-z0-9+.-]*:/i.test(url) && !/^(https?|mailto):/i.test(url) ? '#' : url;
  }

  function renderInline(text) {
    var codes = [];
    // Pull out `code spans` first so nothing inside them is treated as Markdown.
    var s = text.replace(/(`+)([\s\S]*?[^`])\1(?!`)/g, function (_, ticks, code) {
      codes.push('<code class="inline">' + escapeHtml(code.replace(/^ ([\s\S]*) $/, '$1')) + '</code>');
      return '\u0000' + (codes.length - 1) + '\u0000';
    });
    s = escapeHtml(s);
    // \* \_ etc. -> literal characters
    s = s.replace(/\\([\\`*_{}\[\]()#+\-.!])/g, function (_, ch) {
      codes.push(ch);
      return '\u0000' + (codes.length - 1) + '\u0000';
    });
    // [text](url)
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (_, label, url) {
      var href = safeUrl(url);
      var external = /^https?:\/\//i.test(href) ? ' target="_blank" rel="noopener noreferrer"' : '';
      return '<a href="' + href + '"' + external + '>' + label + '</a>';
    });
    s = s.replace(/\*\*(?=\S)([\s\S]*?\S)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^\w])__(?=\S)([\s\S]*?\S)__(?!\w)/g, '$1<strong>$2</strong>');
    s = s.replace(/\*(?=\S)([^*]*?\S)\*/g, '<em>$1</em>');
    // _italic_ only at word edges, so names like {{USERNAME_UPPER}}_CODE are left alone.
    s = s.replace(/(^|[^\w])_(?=\S)([^_]*?\S)_(?!\w)/g, '$1<em>$2</em>');
    // Hard line breaks: two trailing spaces or a trailing backslash.
    s = s.replace(/( {2,}|\\)\n/g, '<br>\n');
    return s.replace(/\u0000(\d+)\u0000/g, function (_, i) { return codes[Number(i)]; });
  }

  var FENCE_RE = /^ {0,3}(`{3,}|~{3,})(.*)$/;
  var HEADING_RE = /^ {0,3}(#{1,6})\s+(.*?)(\s+#+)?\s*$/;
  var HR_RE = /^ {0,3}([-*_])(\s*\1){2,}\s*$/;
  var QUOTE_RE = /^ {0,3}>/;
  var LIST_RE = /^( {0,3})([-*+]|\d{1,9}[.)])( +|$)/;
  var TABLE_RE = /^ {0,3}\|/;
  var TABLE_SEP_RE = /^ {0,3}\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/;

  function startsBlock(line) {
    return FENCE_RE.test(line) || HEADING_RE.test(line) || HR_RE.test(line) || QUOTE_RE.test(line) || LIST_RE.test(line) || TABLE_RE.test(line);
  }

  /** GitHub-style pipe table: header row, separator row, body rows. */
  function renderTable(lines) {
    function cells(row) {
      return row.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(function (c) { return renderInline(c.trim()); });
    }
    var head = cells(lines[0]);
    var body = lines.slice(2).map(cells);
    return '<div class="table-wrap"><table><thead><tr>' +
      head.map(function (c) { return '<th>' + c + '</th>'; }).join('') + '</tr></thead><tbody>' +
      body.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>'; }).join('') +
      '</tbody></table></div>';
  }

  function leadingSpaces(line) {
    return line.match(/^ */)[0].length;
  }

  function renderFence(info, code) {
    var lang = (info.split(/\s+/)[0] || 'text').toLowerCase();
    var title = (info.match(/title="([^"]*)"/) || [])[1] || lang;
    return (
      '<div class="code-wrap"><span class="code-label">' + escapeHtml(title) + '</span>' +
      '<button type="button" class="copy">Copy</button>' +
      '<pre><code data-lang="' + escapeHtml(lang) + '">' + escapeHtml(code) + '</code></pre></div>'
    );
  }

  function renderQuote(lines) {
    var m = lines[0].match(/^\s*\[!(\w+)\]\s*(.*)$/);
    var cls = m && CALLOUTS[m[1].toUpperCase()];
    if (cls) {
      var rest = (m[2] ? [m[2]] : []).concat(lines.slice(1));
      return '<div class="' + cls + '">' + renderBlocks(rest.join('\n')) + '</div>';
    }
    return '<blockquote>' + renderBlocks(lines.join('\n')) + '</blockquote>';
  }

  /** Reads one list starting at lines[i]; returns [html, nextIndex]. */
  function renderList(lines, i) {
    var first = lines[i].match(LIST_RE);
    var ordered = /\d/.test(first[2]);
    var items = [];
    var loose = false;

    while (i < lines.length) {
      var m = lines[i].match(LIST_RE);
      if (!m || /\d/.test(m[2]) !== ordered) break;
      var indent = m[1].length + m[2].length + Math.max(1, Math.min(m[3].length, 4));
      var item = [lines[i].slice(indent)];
      i++;
      while (i < lines.length) {
        var line = lines[i];
        if (!line.trim()) {
          // A blank line continues the item only if indented content follows.
          var j = i;
          while (j < lines.length && !lines[j].trim()) j++;
          if (j < lines.length && leadingSpaces(lines[j]) >= indent) {
            for (; i < j; i++) item.push('');
            continue;
          }
          break;
        }
        if (leadingSpaces(line) >= indent) { item.push(line.slice(indent)); i++; continue; }
        if (startsBlock(line)) break;
        item.push(line.trim()); // lazy paragraph continuation
        i++;
      }
      items.push(item);

      // Blank lines between items make it a "loose" list (items wrapped in <p>).
      var k = i;
      while (k < lines.length && !lines[k].trim()) k++;
      if (k > i && k < lines.length) {
        var next = lines[k].match(LIST_RE);
        if (next && /\d/.test(next[2]) === ordered) { loose = true; i = k; continue; }
      }
      if (k > i) break;
    }

    var checklist = !ordered && items.every(function (it) { return /^\[[ xX]\]\s+/.test(it[0]); });
    var tag = ordered ? 'ol' : 'ul';
    var start = ordered && parseInt(first[2], 10) !== 1 ? ' start="' + parseInt(first[2], 10) + '"' : '';
    var html = '<' + tag + start + (checklist ? ' class="checklist"' : '') + '>' +
      items.map(function (it) {
        if (checklist) it[0] = it[0].replace(/^\[[ xX]\]\s+/, '');
        return '<li>' + renderBlocks(it.join('\n'), !loose) + '</li>';
      }).join('') +
      '</' + tag + '>';
    return [html, i];
  }

  /** Block-level Markdown. tight=true leaves paragraphs unwrapped (for tight list items). */
  function renderBlocks(src, tight) {
    var lines = src.replace(/\r\n?/g, '\n').replace(/\t/g, '    ').split('\n');
    var out = [];
    var i = 0;
    var m;

    while (i < lines.length) {
      var line = lines[i];

      if (!line.trim()) { i++; continue; }

      if ((m = line.match(FENCE_RE))) {
        var close = new RegExp('^ {0,3}' + (m[1][0] === '`' ? '`' : '~') + '{' + m[1].length + ',}\\s*$');
        var body = [];
        i++;
        while (i < lines.length && !close.test(lines[i])) body.push(lines[i++]);
        i++; // skip the closing fence
        out.push(renderFence(m[2].trim(), body.join('\n')));
        continue;
      }

      if ((m = line.match(HEADING_RE))) {
        var n = m[1].length;
        out.push('<h' + n + '>' + renderInline(m[2]) + '</h' + n + '>');
        i++;
        continue;
      }

      if (HR_RE.test(line)) { out.push('<hr>'); i++; continue; }

      if (QUOTE_RE.test(line)) {
        var quote = [];
        while (i < lines.length && QUOTE_RE.test(lines[i])) quote.push(lines[i++].replace(/^ {0,3}> ?/, ''));
        out.push(renderQuote(quote));
        continue;
      }

      if (TABLE_RE.test(line) && i + 1 < lines.length && TABLE_SEP_RE.test(lines[i + 1])) {
        var rows = [];
        while (i < lines.length && TABLE_RE.test(lines[i])) rows.push(lines[i++]);
        out.push(renderTable(rows));
        continue;
      }

      if (LIST_RE.test(line)) {
        var list = renderList(lines, i);
        out.push(list[0]);
        i = list[1];
        continue;
      }

      var para = [];
      while (i < lines.length && lines[i].trim() && !startsBlock(lines[i])) para.push(lines[i++].replace(/^\s+/, ''));
      var inline = renderInline(para.join('\n').replace(/\s+$/, ''));
      out.push(tight ? inline : '<p>' + inline + '</p>');
    }
    return out.join('\n');
  }

  /** Tiny frontmatter parser (flat key: value only). */
  /**
   * Splits one Markdown block into sections. A section starts at a "---" line
   * followed by "key: value" lines (including id:) and a closing "---".
   * Lines inside ``` code fences are never treated as frontmatter.
   */
  function splitSections(raw, n) {
    var lines = raw.replace(/\r\n?/g, '\n').split('\n');
    var starts = [];
    var fence = null;
    for (var i = 0; i < lines.length; i++) {
      var f = lines[i].match(/^ {0,3}(`{3,}|~{3,})/);
      if (f) {
        if (!fence) fence = f[1];
        else if (f[1][0] === fence[0] && f[1].length >= fence.length && /^\s*[`~]+\s*$/.test(lines[i])) fence = null;
        continue;
      }
      if (fence || lines[i].trim() !== '---') continue;
      var j = i + 1;
      var hasId = false;
      while (j < lines.length && /^[A-Za-z]+:/.test(lines[j])) { if (/^id:/.test(lines[j])) hasId = true; j++; }
      if (hasId && j < lines.length && lines[j].trim() === '---') { starts.push(i); i = j; }
    }
    if (!starts.length) throw new Error('Markdown block ' + n + ': no frontmatter found (each section starts with --- / id: ... / ---)');
    if (lines.slice(0, starts[0]).join('').trim()) throw new Error('Markdown block ' + n + ': text before the first frontmatter');
    return starts.map(function (start, k) {
      return lines.slice(start, k + 1 < starts.length ? starts[k + 1] : lines.length).join('\n');
    });
  }

  function parseSection(raw, where) {
    var m = raw.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
    if (!m) throw new Error(where + ': missing frontmatter block');
    var meta = {};
    m[1].split(/\r?\n/).forEach(function (line) {
      if (!line.trim()) return;
      var kv = line.match(/^([A-Za-z]+):\s*(.*)$/);
      if (!kv) throw new Error(where + ': bad frontmatter line "' + line + '"');
      meta[kv[1]] = kv[2].replace(/^"(.*)"$/, '$1');
    });
    ['id', 'nav', 'title'].forEach(function (key) {
      if (!meta[key]) throw new Error(where + ': frontmatter needs "' + key + '"');
    });
    if (!/^[a-z0-9-]+$/.test(meta.id)) throw new Error(where + ': id must be lowercase letters, digits, dashes');
    return {
      id: meta.id,
      nav: meta.nav,
      title: meta.title,
      step: meta.step,
      eyebrow: meta.eyebrow,
      leadHtml: meta.lead ? renderInline(meta.lead) : '',
      html: renderBlocks(m[2]),
    };
  }

  /* =================================================================
     Page
     ================================================================= */

  /** Only these characters reach the page, so substituted values can never inject markup. */
  function safeValue(value, fallback) {
    return String(value || '').trim().replace(/[^A-Za-z0-9._-]/g, '') || fallback;
  }

  function applyTemplate(html, username, repo, githubUser) {
    return html
      .split('{{USERNAME_UPPER}}').join(username.toUpperCase())
      .split('{{USERNAME_LOWER}}').join(username.toLowerCase())
      .split('{{USERNAME}}').join(username)
      .split('{{REPO}}').join(repo)
      .split('{{GITHUB_USER}}').join(githubUser);
  }

  function loadSettings() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch (e) { return {}; }
  }

  function saveSettings(settings) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(settings)); } catch (e) { /* storage blocked */ }
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return legacyCopy(text); });
    }
    return Promise.resolve(legacyCopy(text));
  }

  // Clipboard API needs https or localhost; this fallback also works from file://.
  function legacyCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  function sectionHtml(s, u, r, g) {
    var titleId = s.id + '-title';
    var title = '<h2 id="' + titleId + '">' + escapeHtml(s.title) + '</h2>';
    var lead = s.leadHtml ? '<p>' + applyTemplate(s.leadHtml, u, r, g) + '</p>' : '';
    var head = s.step
      ? '<div class="step-header"><div class="step-number" aria-hidden="true">' + escapeHtml(s.step) + '</div>' +
        '<div>' + title + lead + '</div></div>'
      : title + lead;
    return (
      '<section class="card' + (s.eyebrow ? ' appendix' : '') + '" id="' + s.id + '" data-section="' + s.id + '" aria-labelledby="' + titleId + '">' +
      (s.eyebrow ? '<div class="eyebrow appendix-eyebrow">' + escapeHtml(s.eyebrow) + '</div>' : '') +
      head +
      '<div class="card-body">' + applyTemplate(s.html, u, r, g) + '</div>' +
      '</section>'
    );
  }

  var app = document.getElementById('wsl-guide');
  app.innerHTML =
    '<div class="shell">' +
      '<header class="hero">' +
        '<div class="eyebrow">' + escapeHtml(CONFIG.eyebrow) + '</div>' +
        '<h1>' + escapeHtml(CONFIG.title) + '</h1>' +
        '<p>' + escapeHtml(CONFIG.description) + '</p>' +
      '</header>' +
      '<section class="config" aria-labelledby="wsl-guide-config-title">' +
        '<h2 id="wsl-guide-config-title">Customize this guide</h2>' +
        '<p class="config-note">Change these values once. Every affected path and command below updates automatically.</p>' +
        '<div class="fields">' +
          '<label>WSL username<input data-field="username" spellcheck="false" autocomplete="off"></label>' +
          '<label>Repository name<input data-field="repo" spellcheck="false" autocomplete="off"></label>' +
          '<label>GitHub username<input data-field="github" spellcheck="false" autocomplete="off"></label>' +
        '</div>' +
        '<div class="path-preview">Resolved repository path: <strong data-path-preview></strong></div>' +
      '</section>' +
      '<div class="layout">' +
        '<nav aria-label="Guide navigation"><strong>Contents</strong><div data-nav></div></nav>' +
        '<div class="guide-main" data-main></div>' +
      '</div>' +
    '</div>';

  // Look things up inside the guide only, so nothing collides with the host page.
  var userInput = app.querySelector('[data-field="username"]');
  var repoInput = app.querySelector('[data-field="repo"]');
  var githubInput = app.querySelector('[data-field="github"]');
  var pathPreview = app.querySelector('[data-path-preview]');
  var navEl = app.querySelector('[data-nav]');
  var mainEl = app.querySelector('[data-main]');

  var sections = [];
  try {
    Array.prototype.forEach.call(document.querySelectorAll('script[type="text/markdown"]'), function (el, i) {
      splitSections(el.textContent, i + 1).forEach(function (text, k) {
        var s = parseSection(text, 'Markdown block ' + (i + 1) + ', section ' + (k + 1));
        if (sections.some(function (o) { return o.id === s.id; })) throw new Error('duplicate section id "' + s.id + '"');
        sections.push(s);
      });
    });
  } catch (err) {
    mainEl.innerHTML = '<div class="status">Could not render the guide: ' + escapeHtml(err.message) + '</div>';
    throw err;
  }

  var stored = loadSettings();
  userInput.value = stored.username || CONFIG.defaultUsername;
  repoInput.value = stored.repo || CONFIG.defaultRepo;
  githubInput.value = stored.githubUser || CONFIG.defaultGithubUser;

  navEl.innerHTML = sections.map(function (s) {
    return '<a href="#' + s.id + '" data-target="' + s.id + '">' + escapeHtml(s.nav) + '</a>';
  }).join('');

  function setActive(id) {
    Array.prototype.forEach.call(navEl.querySelectorAll('a'), function (a) {
      a.classList.toggle('active', a.getAttribute('data-target') === id);
    });
  }

  // Highlight the TOC entry for the section currently in view.
  var observer = null;
  function observeSections() {
    if (observer) observer.disconnect();
    if (typeof IntersectionObserver === 'undefined') return;
    var els = Array.prototype.slice.call(mainEl.querySelectorAll('[data-section]'));
    var visible = {};
    observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { visible[e.target.getAttribute('data-section')] = e.isIntersecting; });
      var first = els.filter(function (el) { return visible[el.getAttribute('data-section')]; })[0];
      if (first) setActive(first.getAttribute('data-section'));
    }, { rootMargin: '-10% 0px -65% 0px' });
    els.forEach(function (el) { observer.observe(el); });
  }

  function render() {
    var u = safeValue(userInput.value, CONFIG.defaultUsername);
    var r = safeValue(repoInput.value, CONFIG.defaultRepo);
    var g = safeValue(githubInput.value, CONFIG.defaultGithubUser);
    pathPreview.textContent = '/home/' + u + '/git/' + r;
    mainEl.innerHTML = sections.map(function (s) { return sectionHtml(s, u, r, g); }).join('');
    saveSettings({ username: userInput.value, repo: repoInput.value, githubUser: githubInput.value });
    observeSections();
  }

  userInput.addEventListener('input', render);
  repoInput.addEventListener('input', render);
  githubInput.addEventListener('input', render);

  navEl.addEventListener('click', function (e) {
    var a = e.target.closest('a[data-target]');
    if (!a) return;
    // Scroll in place only: no URL or history changes, which fail when the page
    // is hosted without a normal site origin (e.g. inside SharePoint).
    e.preventDefault();
    var id = a.getAttribute('data-target');
    var target = mainEl.querySelector('[data-section="' + id + '"]');
    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    setActive(id);
  });

  // One handler for every Copy button.
  mainEl.addEventListener('click', function (e) {
    var button = e.target.closest('button.copy');
    if (!button) return;
    copyText(button.parentElement.querySelector('code').textContent).then(function (ok) {
      button.textContent = ok ? 'Copied' : 'Copy failed';
      setTimeout(function () { button.textContent = 'Copy'; }, 1200);
    });
  });

  render();
  if (sections.length) setActive(sections[0].id);
})();
</script>
</body>
</html>
